<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f8ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小課表" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./app-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <title>小課表｜老師排課與堂數紀錄</title>
  <style>
:root {
  --blue: #2563eb;
  --blue-700: #1d4ed8;
  --blue-50: #eff6ff;
  --ink: #172033;
  --muted: #667085;
  --line: #e7ecf4;
  --bg: #f5f8ff;
  --card: #ffffff;
  --green: #15803d;
  --green-bg: #eaf8ef;
  --orange: #b45309;
  --orange-bg: #fff4df;
  --red: #b42318;
  --red-bg: #feeceb;
  --gray-bg: #f2f4f7;
  --shadow: 0 12px 32px rgba(26, 57, 102, .08);
  --radius: 20px;
}

* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }

.app-shell {
  width: min(100%, 480px);
  min-height: 100dvh;
  margin: 0 auto;
  background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 36%);
  padding: max(18px, env(safe-area-inset-top)) 16px calc(106px + env(safe-area-inset-bottom));
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  letter-spacing: .02em;
}
.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: var(--blue);
  color: white;
  box-shadow: 0 8px 18px rgba(37, 99, 235, .25);
}
.icon-btn {
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 14px;
  background: white;
  color: var(--ink);
  box-shadow: 0 6px 18px rgba(24, 54, 95, .06);
}

.hero { margin-bottom: 18px; }
.hero h1 { margin: 0 0 6px; font-size: 28px; line-height: 1.2; }
.hero p { margin: 0; color: var(--muted); font-size: 15px; }

.summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 18px 0 22px;
}
.summary-card {
  background: var(--card);
  border: 1px solid rgba(231, 236, 244, .9);
  border-radius: 18px;
  padding: 16px;
  box-shadow: var(--shadow);
}
.summary-card .eyebrow { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.summary-card strong { font-size: 28px; color: var(--blue); }
.summary-card span { margin-left: 4px; color: var(--muted); font-size: 13px; }

.section { margin-top: 20px; }
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 2px 12px;
}
.section-heading h2 { margin: 0; font-size: 20px; }
.section-heading .subtle { color: var(--muted); font-size: 13px; }

.card-list { display: grid; gap: 12px; }
.lesson-card, .student-card, .record-card, .settings-card, .empty-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.lesson-card { padding: 16px; }
.lesson-top {
  display: grid;
  grid-template-columns: 72px 1fr auto;
  gap: 12px;
  align-items: center;
}
.time-block strong { color: var(--blue); font-size: 19px; display: block; }
.time-block span { color: var(--muted); font-size: 13px; }
.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--blue-50);
  color: var(--blue-700);
  font-weight: 800;
  flex: 0 0 auto;
}
.lesson-person { display: flex; gap: 10px; align-items: center; min-width: 0; }
.lesson-person h3, .student-card h3 { margin: 0 0 4px; font-size: 17px; }
.lesson-meta { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lesson-actions { display: flex; justify-content: flex-end; margin-top: 14px; }

.btn {
  min-height: 44px;
  border: 0;
  border-radius: 14px;
  padding: 10px 16px;
  font-weight: 700;
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--blue); color: white; box-shadow: 0 8px 18px rgba(37, 99, 235, .2); }
.btn-primary:hover { background: var(--blue-700); }
.btn-soft { background: var(--blue-50); color: var(--blue-700); }
.btn-ghost { background: transparent; color: var(--blue); }
.btn-danger { background: var(--red-bg); color: var(--red); }
.btn-full { width: 100%; }

.status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}
.status-scheduled { background: var(--blue-50); color: var(--blue-700); }
.status-inProgress, .status-completed { background: var(--green-bg); color: var(--green); }
.status-studentLeave, .status-teacherLeave, .status-absent, .status-rescheduled { background: var(--orange-bg); color: var(--orange); }
.status-cancelled { background: var(--gray-bg); color: #667085; }

.fab-row { margin-top: 18px; }

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(100%, 480px);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: rgba(255,255,255,.94);
  backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
  z-index: 50;
}
.nav-btn {
  border: 0;
  background: transparent;
  min-height: 58px;
  border-radius: 16px;
  color: #7c8799;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 4px;
  font-size: 12px;
}
.nav-btn .nav-icon { font-size: 21px; }
.nav-btn.active { color: var(--blue); background: var(--blue-50); font-weight: 800; }

.page-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 18px; }
.page-title-row h1 { margin: 0; font-size: 26px; }

.week-strip {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 16px;
}
.day-chip {
  border: 0;
  border-radius: 14px;
  background: white;
  padding: 9px 4px;
  color: var(--muted);
  min-height: 58px;
  border: 1px solid var(--line);
}
.day-chip strong { display: block; color: var(--ink); margin-top: 3px; }
.day-chip.active { background: var(--blue); color: #dbeafe; border-color: var(--blue); }
.day-chip.active strong { color: white; }
.date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.date-nav .date-label { font-weight: 800; }
.mini-btn { min-height: 38px; border: 1px solid var(--line); background: white; border-radius: 12px; padding: 7px 12px; }

.search-row { display: flex; gap: 10px; margin-bottom: 14px; }
.search-row input { flex: 1; }
.input, input, select, textarea {
  width: 100%;
  border: 1px solid #d8e0ec;
  border-radius: 14px;
  min-height: 46px;
  padding: 11px 13px;
  background: white;
  color: var(--ink);
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, .10); }
textarea { min-height: 96px; resize: vertical; }

.student-card { padding: 16px; }
.student-card button.card-hit {
  width: 100%;
  border: 0;
  background: transparent;
  padding: 0;
  color: inherit;
  text-align: left;
}
.student-head { display: flex; align-items: center; gap: 11px; }
.student-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.stat-box { background: #f8fafc; border-radius: 14px; padding: 11px 12px; }
.stat-box small { display: block; color: var(--muted); margin-bottom: 4px; }
.stat-box strong { font-size: 18px; }
.warning { color: var(--orange); font-size: 12px; font-weight: 800; margin-top: 8px; }

.empty-card { padding: 28px 18px; text-align: center; }
.empty-icon { font-size: 34px; margin-bottom: 10px; }
.empty-card h3 { margin: 0 0 8px; }
.empty-card p { color: var(--muted); margin: 0 0 16px; line-height: 1.6; }

.detail-hero { padding: 18px; background: white; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.detail-title { display: flex; gap: 12px; align-items: center; }
.detail-title .avatar { width: 54px; height: 54px; }
.detail-title h1 { font-size: 24px; margin: 0 0 4px; }
.detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.info-cell { padding: 13px; background: #f8fafc; border-radius: 14px; }
.info-cell small { display: block; color: var(--muted); margin-bottom: 5px; }
.info-cell strong { font-size: 16px; }

.record-card { padding: 14px 15px; }
.record-row { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.record-card h3 { margin: 0 0 4px; font-size: 16px; }
.record-card p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }

.settings-card { padding: 6px 16px; }
.settings-item {
  width: 100%;
  min-height: 58px;
  border: 0;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  text-align: left;
}
.settings-item:last-child { border-bottom: 0; }
.settings-item small { color: var(--muted); }

.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, .45);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 18px 0 0;
}
.sheet {
  width: min(100%, 480px);
  max-height: 92dvh;
  overflow: auto;
  background: white;
  border-radius: 26px 26px 0 0;
  padding: 12px 18px calc(24px + env(safe-area-inset-bottom));
  box-shadow: 0 -18px 50px rgba(15, 23, 42, .18);
}
.sheet-handle { width: 42px; height: 5px; background: #d6dce7; border-radius: 99px; margin: 2px auto 16px; }
.sheet-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.sheet-header h2 { margin: 0; font-size: 22px; }
.close-btn { width: 40px; height: 40px; border: 0; background: var(--gray-bg); border-radius: 12px; }
.form-grid { display: grid; gap: 14px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 7px; }
.field .help { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.45; }
.form-error { color: var(--red); font-size: 12px; margin-top: 6px; }
.segmented { display: grid; grid-template-columns: repeat(2, 1fr); background: #f3f5f9; padding: 4px; border-radius: 14px; gap: 4px; }
.segmented label { margin: 0; }
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented span { display: block; text-align: center; padding: 10px; border-radius: 11px; color: var(--muted); font-weight: 700; }
.segmented input:checked + span { background: white; color: var(--blue); box-shadow: 0 3px 10px rgba(15, 23, 42, .08); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #f8fafc; border-radius: 14px; padding: 12px; }
.toggle { position: relative; width: 50px; height: 30px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 999px; transition: .2s; }
.slider::before { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: .2s; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
.toggle input:checked + .slider { background: var(--blue); }
.toggle input:checked + .slider::before { transform: translateX(20px); }
.status-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.status-option input { position: absolute; opacity: 0; }
.status-option span { display: block; border: 1px solid var(--line); border-radius: 14px; padding: 11px; text-align: center; color: var(--muted); font-weight: 700; }
.status-option input:checked + span { border-color: var(--blue); background: var(--blue-50); color: var(--blue); }
.sheet-footer { position: sticky; bottom: -24px; background: white; padding-top: 14px; margin-top: 8px; }

.toast-root { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 200; width: min(calc(100% - 32px), 440px); pointer-events: none; }
.toast { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #172033; color: white; border-radius: 14px; padding: 12px 14px; box-shadow: 0 14px 34px rgba(15, 23, 42, .25); animation: toastIn .2s ease; pointer-events: auto; }
.toast.error { background: var(--red); }
.toast-actions { display: flex; gap: 6px; flex: 0 0 auto; }
.toast-action { border: 0; border-radius: 9px; background: rgba(255,255,255,.16); color: white; padding: 7px 9px; font-weight: 800; white-space: nowrap; }
.credit-alert { margin: 0 0 12px; padding: 12px 14px; border: 1px solid #fed7aa; border-radius: 15px; background: #fff7ed; color: #9a3412; }
.credit-alert strong { display: block; font-size: 14px; }
.credit-alert p { margin: 4px 0 0; font-size: 13px; }
.credit-alert-actions { display: flex; gap: 8px; margin-top: 10px; }
.credit-alert-actions .btn { padding: 8px 11px; min-height: 36px; }
.credit-alert details { margin-top: 8px; }
.credit-alert summary { cursor: pointer; font-weight: 800; }
.credit-alert-item { padding: 9px 0; border-top: 1px solid #fed7aa; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.file-input { display: none; }
.version { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
.back-btn { border: 0; background: white; border-radius: 13px; width: 42px; height: 42px; box-shadow: 0 5px 16px rgba(24,54,95,.06); }


/* v0.2：高密度快速操作模式 */
.app-shell { padding-left: 12px; padding-right: 12px; }
.topbar { margin-bottom: 14px; }
.hero { margin-bottom: 10px; }
.hero h1 { font-size: 24px; margin-bottom: 4px; }
.hero p { font-size: 13px; }
.summary-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 11px 14px;
  box-shadow: 0 7px 20px rgba(26,57,102,.055);
  margin: 12px 0 16px;
  color: var(--muted);
  font-size: 13px;
}
.summary-bar strong { color: var(--blue); font-size: 19px; margin: 0 2px; }
.summary-divider { width: 1px; align-self: stretch; background: var(--line); }
.section { margin-top: 14px; }
.section-heading { margin-bottom: 8px; }
.section-heading h2 { font-size: 18px; }
.card-list { gap: 8px; }
.lesson-card {
  padding: 10px 11px;
  border-radius: 16px;
  box-shadow: 0 7px 20px rgba(26,57,102,.055);
}
.lesson-top {
  grid-template-columns: 55px minmax(0, 1fr) auto;
  gap: 9px;
  min-height: 48px;
}
.time-block strong { font-size: 17px; line-height: 1.1; }
.time-block span { font-size: 11px; }
.lesson-card .avatar { display: none; }
.lesson-person { gap: 0; }
.lesson-person h3 { margin: 0 0 2px; font-size: 15.5px; line-height: 1.25; }
.lesson-meta {
  font-size: 11.5px;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lesson-control { display: flex; align-items: center; gap: 5px; }
.quick-action {
  min-height: 38px;
  border: 0;
  border-radius: 12px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 800;
  white-space: nowrap;
}
.quick-action.primary { background: var(--blue); color: white; }
.quick-action.soft { background: var(--blue-50); color: var(--blue-700); }
.quick-action.done { background: var(--green-bg); color: var(--green); }
.quick-action.warn { background: var(--orange-bg); color: var(--orange); }
.quick-action.muted { background: var(--gray-bg); color: var(--muted); }
.lesson-menu-btn {
  width: 36px;
  min-width: 36px;
  height: 38px;
  border: 0;
  border-radius: 12px;
  background: #f5f7fb;
  color: var(--muted);
  font-weight: 900;
  font-size: 18px;
  line-height: 1;
}
.lesson-actions { display: none; }
.fab-row { margin-top: 12px; }
.btn-full { min-height: 46px; }
.quick-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
.quick-chip {
  min-height: 34px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: white;
  padding: 6px 10px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.compact-help { color: var(--muted); font-size: 11.5px; margin-top: 6px; }


/* v0.3：固定排課、最近學生與快速複製 */
.recent-student-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 1px 4px;
  scrollbar-width: none;
}
.recent-student-row::-webkit-scrollbar { display: none; }
.recent-student-chip {
  min-width: max-content;
  min-height: 38px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: white;
  color: var(--ink);
  padding: 7px 11px;
  font-size: 12px;
  font-weight: 750;
}
.recent-student-chip.active {
  border-color: #93b4ff;
  background: var(--blue-50);
  color: var(--blue-700);
}
.copy-template {
  border: 1px dashed #b8c8e8;
  background: #f7faff;
  border-radius: 14px;
  padding: 10px 11px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.copy-template-text { min-width: 0; }
.copy-template-text strong { display: block; font-size: 13px; margin-bottom: 2px; }
.copy-template-text span {
  display: block;
  color: var(--muted);
  font-size: 11.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.copy-template button { min-height: 36px; padding: 7px 10px; flex: 0 0 auto; }
.repeat-panel {
  display: none;
  border: 1px solid #dce6fa;
  background: #f8fbff;
  border-radius: 16px;
  padding: 12px;
  gap: 12px;
}
.repeat-panel.open { display: grid; }
.weekday-options {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}
.weekday-option input { position: absolute; opacity: 0; pointer-events: none; }
.weekday-option span {
  min-height: 37px;
  border: 1px solid var(--line);
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: white;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}
.weekday-option input:checked + span {
  background: var(--blue);
  border-color: var(--blue);
  color: white;
}
.repeat-presets { display: flex; flex-wrap: wrap; gap: 6px; }
.repeat-preset {
  min-height: 34px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: white;
  color: var(--muted);
  padding: 6px 10px;
  font-size: 11.5px;
  font-weight: 750;
}
.repeat-preset.active { background: var(--blue-50); border-color: #aac2f8; color: var(--blue-700); }
.repeat-summary {
  border-radius: 12px;
  background: white;
  border: 1px solid var(--line);
  padding: 9px 10px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}
.repeat-summary strong { color: var(--ink); }
.inline-check {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
}
.inline-check input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--blue); }
.lesson-control .quick-action.copy { background: #f4f6fa; color: #526173; }
.lesson-control { flex-wrap: nowrap; }

/* v0.4：課表週視圖與月視圖 */
.calendar-page { min-width: 0; }
.calendar-view-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  margin-bottom: 14px;

  <script>
(() => {
  "use strict";

  const Domain = window.XiaoKeBiaoDomain;
  if (!Domain) throw new Error("小課表資料模組載入失敗");
  const STORAGE_KEY = "xiaokebiao_mvp_v1";

  const STATUS_LABELS = {
    scheduled: "尚未開始",
    inProgress: "上課中",
    completed: "已完成",

    return {
      tab: "home",
      selectedDate: todayISO(),
      search: "",
      studentDetailId: null,
      calendarView: loadCalendarView(),
    };

  function loadCalendarView() {
    try {
      const view = localStorage.getItem(CALENDAR_VIEW_KEY);
      return view === "month" ? "month" : "week";
    } catch (err) {
      console.warn("讀取日曆檢視設定失敗", err);
      return "week";
    }
  }

  function saveCalendarView(view) {
    try {
      localStorage.setItem(CALENDAR_VIEW_KEY, view);
    } catch (err) {
      console.warn("儲存日曆檢視設定失敗", err);
    }

  function uid(prefix = "id") {
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
  }

  function pad(n) { return String(n).padStart(2, "0"); }

  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function parseISODate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function dateToISO(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function addDays(iso, amount) {
    const d = parseISODate(iso);
    d.setDate(d.getDate() + amount);
    return dateToISO(d);
  }

  function formatDate(iso, withWeek = true) {
    const d = parseISODate(iso);
    const base = new Intl.DateTimeFormat("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
    if (!withWeek) return base;
    const week = new Intl.DateTimeFormat("zh-TW", { weekday: "short" }).format(d);
    return `${base}（${week}）`;
  }

  function formatShortDate(iso) {
    const d = parseISODate(iso);
    return new Intl.DateTimeFormat("zh-TW", { month: "numeric", day: "numeric", weekday: "short" }).format(d);
  }

  function greeting() {
    const h = new Date().getHours();
    if (h < 11) return "早安";
    if (h < 18) return "午安";
    return "晚安";
  }

      name: "林老師",
      phone: "",
      email: "",
      lineId: "",
      subjects: [],
      defaultLessonMode: "",
      defaultLocation: "",
      defaultDuration: 60,
      note: "",
      updatedAt: "",
    };
  }

  function normalizeTeacherProfile(profile) {
    const defaults = defaultTeacherProfile();
    const source = profile && typeof profile === "object" ? profile : {};
    const duration = Number(source.defaultDuration);
    const subjects = Array.isArray(source.subjects)
      ? source.subjects
      : typeof source.subjects === "string"
        ? source.subjects.split(/[,，、\n]/)
        : [];
    return {
      ...defaults,
      name: String(source.name || defaults.name).trim() || defaults.name,
      phone: String(source.phone || "").trim(),
      email: String(source.email || "").trim(),
      lineId: String(source.lineId || "").trim(),
      subjects: [...new Set(subjects.map(item => String(item).trim()).filter(Boolean))],
      defaultLessonMode: ["inPerson", "online"].includes(source.defaultLessonMode) ? source.defaultLessonMode : "",
      defaultLocation: String(source.defaultLocation || "").trim(),
      defaultDuration: [30, 45, 60, 90, 120].includes(duration) ? duration : 60,
      note: String(source.note || "").trim(),
      updatedAt: String(source.updatedAt || ""),
    };
  }

  function createDemoData() {
    const now = new Date().toISOString();
    const today = todayISO();
    const students = [
      { id: "stu_wang", name: "王小明", subject: "數學", phone: "0912-345-678", contactNote: "以 LINE 聯絡家長", billingType: "package", totalLessons: 10, usedLessons: 4, pricePerLesson: 800, defaultDuration: 60, notes: "國二，複習進度需放慢", isDemoData: true, createdAt: now, updatedAt: now },
      { id: "stu_chen", name: "陳小安", subject: "英文", phone: "", contactNote: "週末前確認教材", billingType: "package", totalLessons: 20, usedLessons: 18, pricePerLesson: 700, defaultDuration: 60, notes: "準備英檢初級", isDemoData: true, createdAt: now, updatedAt: now },
      { id: "stu_li", name: "李雨晴", subject: "鋼琴", phone: "0988-222-123", contactNote: "可傳訊息給本人", billingType: "perLesson", totalLessons: null, usedLessons: 0, pricePerLesson: 1000, defaultDuration: 60, notes: "成人初學", isDemoData: true, createdAt: now, updatedAt: now },
      { id: "stu_zhang", name: "張子維", subject: "國文", phone: "", contactNote: "", billingType: "package", totalLessons: 8, usedLessons: 2, pricePerLesson: 750, defaultDuration: 60, notes: "作文為主", isDemoData: true, createdAt: now, updatedAt: now },
    ];

    const completedLessonId = "lesson_demo_completed";
    const recordId = "record_demo_completed";
    const lessons = [
      { id: "lesson_demo_1", studentId: "stu_wang", subject: "數學", date: today, startTime: "09:30", endTime: "10:30", mode: "inPerson", location: "學生家", recurrenceGroupId: null, status: "scheduled", startedAt: null, recordId: null, notes: "二次函數", isDemoData: true, createdAt: now, updatedAt: now },
      { id: "lesson_demo_2", studentId: "stu_chen", subject: "英文", date: today, startTime: "13:00", endTime: "14:00", mode: "online", location: "Google Meet", recurrenceGroupId: null, status: "inProgress", startedAt: now, recordId: null, notes: "閱讀理解", isDemoData: true, createdAt: now, updatedAt: now },
      { id: completedLessonId, studentId: "stu_li", subject: "鋼琴", date: today, startTime: "16:30", endTime: "17:30", mode: "inPerson", location: "琴房", recurrenceGroupId: null, status: "completed", startedAt: now, recordId, notes: "音階與節奏", isDemoData: true, createdAt: now, updatedAt: now },
      { id: "lesson_demo_4", studentId: "stu_zhang", subject: "國文", date: addDays(today, 1), startTime: "10:00", endTime: "11:00", mode: "online", location: "Zoom", recurrenceGroupId: null, status: "scheduled", startedAt: null, recordId: null, notes: "作文架構", isDemoData: true, createdAt: now, updatedAt: now },
      { id: "lesson_demo_5", studentId: "stu_wang", subject: "數學", date: addDays(today, 3), startTime: "14:00", endTime: "15:00", mode: "inPerson", location: "學生家", recurrenceGroupId: null, status: "scheduled", startedAt: null, recordId: null, notes: "", isDemoData: true, createdAt: now, updatedAt: now },
    ];

    const lessonRecords = [
      { id: recordId, lessonId: completedLessonId, studentId: "stu_li", status: "completed", deductLesson: false, note: "今天節奏感進步，回家練 C 大調。", isDemoData: true, recordedAt: now, updatedAt: now },
    ];

    return Domain.normalizeData({
      teacherProfile: defaultTeacherProfile(),
      students,
      lessons,
      lessonRecords,
      lessonCreditTransactions: [],
      settings: { ...Domain.defaultSettings(false), hasCompletedOnboarding: false, onboardingVersion: 0 },
      dataVersion: DATA_VERSION,
      version: APP_VERSION,
    }, { existingUser: false, now });
  }

  function validateImportedData(data) {
    return Boolean(
      data
      && data.dataVersion === DATA_VERSION
      && data.teacherProfile
      && data.settings
      && Array.isArray(data.students)
      && Array.isArray(data.lessons)
      && Array.isArray(data.lessonRecords)
      && Array.isArray(data.lessonCreditTransactions)
    );
  }

  function normalizeStoredData(data, options = {}) {
    return Domain.normalizeData(data, {
      existingUser: options.existingUser !== false,
      now: options.now || new Date().toISOString(),
    });
  }

  function loadData() {
    let raw = null;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        const demo = createDemoData();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(demo));
        return demo;
      }
      const parsed = JSON.parse(raw);
      const sourceVersion = Number(parsed.dataVersion || 0);
      const normalized = normalizeStoredData(parsed, { existingUser: true });
      if (!validateImportedData(normalized)) throw new Error("資料遷移後格式不正確");
      if (sourceVersion < DATA_VERSION) {
        const snapshotKey = `${STORAGE_KEY}_migration_backup_v${sourceVersion}`;
        if (!localStorage.getItem(snapshotKey)) localStorage.setItem(snapshotKey, raw);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
      }
      return normalized;
    } catch (err) {
      invalidStoredData = raw;
      console.warn("讀取或遷移本機資料失敗；原始內容未被覆寫", err);
    }
    return createDemoData();
  }

  function saveData() {
    if (invalidStoredData !== null && !localStorage.getItem(`${STORAGE_KEY}_recovery`)) {
      localStorage.setItem(`${STORAGE_KEY}_recovery`, invalidStoredData);
    }
    state = normalizeStoredData({ ...state, dataVersion: DATA_VERSION, version: APP_VERSION }, { existingUser: true });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    invalidStoredData = null;
  }

  function calculateRemainingLessons(student) {
    if (!student || student.billingType === "perLesson") return null;
    if (Array.isArray(state.lessonCreditTransactions)) return Domain.creditBalance(state, student.id);
    if (student.totalLessons == null) return null;
    return Math.max(0, Number(student.totalLessons || 0) - Number(student.usedLessons || 0));
  }

  function timeToMinutes(time) {
    return Domain.timeToMinutes(time);
  }

  function hasScheduleConflict(candidate, ignoreLessonId = null) {
    const start = timeToMinutes(candidate.startTime);
    const end = timeToMinutes(candidate.endTime);
    return state.lessons.some(l => {
      if (l.deletedAt || l.id === ignoreLessonId || l.date !== candidate.date || l.status === "cancelled" || l.status === "rescheduled") return false;
      const otherStart = timeToMinutes(l.startTime);
      const otherEnd = timeToMinutes(l.endTime);
      return start < otherEnd && end > otherStart;
    });
  }

  function weekdayNumber(iso) {
    const day = parseISODate(iso).getDay();
    return day === 0 ? 7 : day;
  }

  function weekdayName(number) {
    return ({ 1: "一", 2: "二", 3: "三", 4: "四", 5: "五", 6: "六", 7: "日" })[number] || "";
  }

  function findLessonConflicts(candidateLessons, existingLessons, ignoreLessonId = null) {
    const conflicts = [];
    for (const candidate of candidateLessons) {
      const candidateStart = timeToMinutes(candidate.startTime);
      const candidateEnd = timeToMinutes(candidate.endTime);
      for (const existing of existingLessons) {
        if (existing.id === ignoreLessonId || existing.date !== candidate.date || existing.status === "cancelled" || existing.status === "rescheduled") continue;
        const existingStart = timeToMinutes(existing.startTime);
        const existingEnd = timeToMinutes(existing.endTime);
        if (candidateStart < existingEnd && candidateEnd > existingStart) {
          conflicts.push({ candidate, existing });
        }
      }
    }
    return conflicts;
  }

  function generateRecurringLessonPlan(input, existingLessons, options = {}) {
    return Domain.planRecurrence(input, existingLessons, options);
  }

  function materializeRecurringLessons(baseLesson, candidates) {
    const groupId = uid("rec");
    const now = new Date().toISOString();
    return candidates.map(candidate => ({
      ...baseLesson,
      id: uid("lesson"),
      date: candidate.date,
      recurrenceGroupId: groupId,
      status: "scheduled",
      startedAt: null,
      recordId: null,
      createdAt: now,
      updatedAt: now,
    }));
  }

  function undoRecurrenceGroup(groupId) {
    const targetIds = new Set(state.lessons.filter(lesson => lesson.recurrenceGroupId === groupId).map(lesson => lesson.id));
    if (!targetIds.size) {
      toast("這批排課已不存在", "error");
      return;
    }
    state.lessons = state.lessons.filter(lesson => !targetIds.has(lesson.id));
    state.lessonRecords = state.lessonRecords.filter(record => !targetIds.has(record.lessonId));
    state.lessonCreditTransactions = state.lessonCreditTransactions.filter(transaction => !targetIds.has(transaction.relatedLessonId));
    saveData();
    render();
    toast(`已復原本次排課，共移除 ${targetIds.size} 堂`);
  }

  function formatConflictMessage(skippedItem) {
    const dateText = formatDate(skippedItem.candidate.date);
    const candidateTime = `${skippedItem.candidate.startTime}–${skippedItem.candidate.endTime}`;
    const detail = skippedItem.conflicts.map(({ existing }) => {
      const student = lessonDisplayPerson(existing);
      return `與「${student.name}｜${existing.subject}｜${existing.startTime}–${existing.endTime}」衝突`;
    }).join("；");
    return { dateText, candidateTime, detail };
  }

  function recentStudents(limit = 4) {
    const seen = new Set();
    const ordered = [...state.lessons]
      .sort((a, b) => `${b.date}${b.startTime}`.localeCompare(`${a.date}${a.startTime}`))
      .map(lesson => lesson.studentId)
      .filter(id => {
        if (seen.has(id) || !studentById(id)) return false;
        seen.add(id);
        return true;
      });
    for (const student of state.students) {
      if (!seen.has(student.id)) ordered.push(student.id);
    }
    return ordered.slice(0, limit).map(studentById).filter(Boolean);
  }

  function latestLessonForStudent(studentId, ignoreLessonId = null) {
    return [...state.lessons]
      .filter(item => !item.deletedAt && item.studentId === studentId && item.id !== ignoreLessonId)
      .sort((a, b) => `${b.date}${b.startTime}`.localeCompare(`${a.date}${a.startTime}`))[0] || null;
  }

  function studentById(id) { return state.students.find(s => s.id === id); }
  function lessonById(id) { return state.lessons.find(l => l.id === id); }
  function recordByLessonId(id) { return state.lessonRecords.find(r => r.lessonId === id && !r.deletedAt); }
  function activeLessons() { return state.lessons.filter(lesson => !lesson.deletedAt); }
  function lessonDisplayPerson(lesson) {
    if (lesson.lessonType === "trial") return { name: `${lesson.trial?.name || "未命名"}（試教）`, isTrial: true };
    return studentById(lesson.studentId) || { name: "已刪除學生", isTrial: false };
  }

  function escapeHtml(value = "") {
    return String(value).replace(/[&<>'"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[ch]));
  }

  function money(value) {
    if (value == null || value === "") return "未設定";
    return `NT$${Number(value).toLocaleString("zh-TW")}`;
  }

  function toast(message, type = "success", options = {}) {
    const root = $("#toast-root");
    const actions = Array.isArray(options.actions) ? options.actions : [];
    root.innerHTML = `<div class="toast ${type === "error" ? "error" : ""}"><span>${escapeHtml(message)}</span>${actions.length ? `<span class="toast-actions">${actions.map((action, index) => `<button class="toast-action" type="button" data-toast-index="${index}">${escapeHtml(action.label)}</button>`).join("")}</span>` : ""}</div>`;
    $$("[data-toast-index]", root).forEach(button => button.addEventListener("click", () => {
      const action = actions[Number(button.dataset.toastIndex)];
      root.innerHTML = "";
      clearTimeout(toast.timer);
      action?.handler?.();
    }));
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { root.innerHTML = ""; }, Number(options.duration) || (actions.length ? 8000 : 2600));
  }

    return `<span class="status status-${status}">${STATUS_LABELS[status] || status}</span>`;

  function todayCreditReminders(todayLessons) {
    const reminders = [];
    const studentIds = [...new Set(todayLessons.filter(lesson => lesson.lessonType !== "trial").map(lesson => lesson.studentId))];
    for (const studentId of studentIds) {
      const student = studentById(studentId);
      if (!student || student.billingType !== "package") continue;
      const studentLessons = todayLessons.filter(lesson => lesson.studentId === studentId);
      const completedDeduction = studentLessons.find(lesson => recordByLessonId(lesson.id)?.deductLesson);
      const balance = calculateRemainingLessons(student);
      if (completedDeduction && balance === 0) {
        reminders.push({ student, lesson: completedDeduction, state: "usedUp" });
        continue;
      }
      const upcoming = studentLessons.filter(lesson =>
        ["scheduled", "inProgress"].includes(lesson.status)
        && !recordByLessonId(lesson.id)?.deductLesson
      );
      if (balance > 0 && balance <= upcoming.length) {
        reminders.push({ student, lesson: upcoming[balance - 1], state: "last" });
      }
    }
    return reminders;
  }

  function reminderActions(reminder) {
    return `<div class="credit-alert-actions"><button class="btn btn-soft" data-action="open-student" data-id="${reminder.student.id}">查看學生</button><button class="btn btn-primary" data-action="add-credit" data-id="${reminder.student.id}">新增堂數</button></div>`;
  }

  function renderTodayCreditReminder(todayLessons) {
    const reminders = todayCreditReminders(todayLessons);
    if (!reminders.length) return "";
    if (reminders.length === 1) {
      const reminder = reminders[0];
      const message = reminder.state === "usedUp"
        ? `${reminder.student.name}的堂數已用完`
        : `${reminder.student.name}｜今天 ${reminder.lesson.startTime}｜今天是最後 1 堂`;
      return `<aside class="credit-alert" aria-label="堂數提醒"><strong>${escapeHtml(message)}</strong>${reminderActions(reminder)}</aside>`;
    }
    return `<aside class="credit-alert" aria-label="堂數提醒"><strong>今天有 ${reminders.length} 位學生即將用完堂數</strong><details><summary>展開查看</summary>${reminders.map(reminder => {
      const text = reminder.state === "usedUp" ? `${reminder.student.name}的堂數已用完` : `${reminder.student.name}｜${reminder.lesson.startTime}｜最後 1 堂`;
      return `<div class="credit-alert-item"><p>${escapeHtml(text)}</p>${reminderActions(reminder)}</div>`;
    }).join("")}</details></aside>`;
  }

  function getWeekStartMonday(centerISO) {
    const center = parseISODate(centerISO);
    const weekday = center.getDay();
    const monday = new Date(center);
    monday.setDate(center.getDate() + (weekday === 0 ? -6 : 1 - weekday));
    return dateToISO(monday);
  }

  function weekDates(centerISO) {
    const monday = parseISODate(getWeekStartMonday(centerISO));
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      return dateToISO(d);
    });
  }

  function addMonths(iso, amount) {
    const source = parseISODate(iso);
    const target = new Date(source.getFullYear(), source.getMonth() + amount, 1);
    const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    target.setDate(Math.min(source.getDate(), lastDay));
    return dateToISO(target);
  }

  function monthDates(centerISO) {
    const center = parseISODate(centerISO);
    const first = new Date(center.getFullYear(), center.getMonth(), 1);
    const gridStart = new Date(first);
    gridStart.setDate(first.getDate() - first.getDay());
    return Array.from({ length: 42 }, (_, index) => {
      const date = new Date(gridStart);
      date.setDate(gridStart.getDate() + index);
      return dateToISO(date);
    });
  }

  function calendarPeriodLabel() {
    const selected = parseISODate(ui.selectedDate);
    if (ui.calendarView === "month") return `${selected.getFullYear()}年${selected.getMonth() + 1}月`;
    const dates = weekDates(ui.selectedDate);
    const start = parseISODate(dates[0]);
    const end = parseISODate(dates[6]);
    if (start.getFullYear() === end.getFullYear() && start.getMonth() === end.getMonth()) {
      return `${start.getFullYear()}年${start.getMonth() + 1}月${start.getDate()}日–${end.getDate()}日`;
    }
    if (start.getFullYear() === end.getFullYear()) {
      return `${start.getFullYear()}年${start.getMonth() + 1}月${start.getDate()}日–${end.getMonth() + 1}月${end.getDate()}日`;
    }
    return `${start.getFullYear()}/${start.getMonth() + 1}/${start.getDate()}–${end.getFullYear()}/${end.getMonth() + 1}/${end.getDate()}`;
  }

  function calendarColorIndex(value = "") {
    let hash = 0;
    for (const char of String(value)) hash = ((hash * 31) + char.charCodeAt(0)) >>> 0;
    return hash % 6;
  }

  function lessonsOn(date) {
    return activeLessons().filter(lesson => lesson.date === date).sort((a, b) => {
      const timeOrder = a.startTime.localeCompare(b.startTime);
      return timeOrder || a.endTime.localeCompare(b.endTime);
    });
  }

  function renderCalendarSwitch() {

      <button class="calendar-view-btn ${ui.calendarView === "month" ? "active" : ""}" data-calendar-view="month" aria-pressed="${ui.calendarView === "month"}">月視圖</button>
    </div>`;

  function renderCalendarToolbar() {

      <button class="mini-btn" data-action="calendar-prev" aria-label="上一${unit}">‹</button>
      <div class="calendar-period"><strong>${calendarPeriodLabel()}</strong><button class="calendar-today-btn" data-action="calendar-today">回到今天</button></div>
      <button class="mini-btn" data-action="calendar-next" aria-label="下一${unit}">›</button>
    </div>`;

  function layoutWeekLessons(lessons) {
    const sorted = [...lessons].sort((a, b) => {
      const startOrder = timeToMinutes(a.startTime) - timeToMinutes(b.startTime);
      return startOrder || timeToMinutes(a.endTime) - timeToMinutes(b.endTime);
    });
    const output = [];
    let group = [];
    let groupEnd = -1;
    const finishGroup = () => {
      if (!group.length) return;
      const laneEnds = [];
      const laidOut = group.map(lesson => {
        const start = timeToMinutes(lesson.startTime);
        const end = timeToMinutes(lesson.endTime);
        let lane = laneEnds.findIndex(laneEnd => laneEnd <= start);
        if (lane < 0) lane = laneEnds.length;
        laneEnds[lane] = end;
        return { lesson, lane };
      });
      const laneCount = Math.max(1, laneEnds.length);
      laidOut.forEach(item => output.push({ ...item, laneCount, hasOverlap: laneCount > 1 }));
      group = [];
      groupEnd = -1;
    };
    for (const lesson of sorted) {
      const start = timeToMinutes(lesson.startTime);
      if (group.length && start >= groupEnd) finishGroup();
      group.push(lesson);
      groupEnd = Math.max(groupEnd, timeToMinutes(lesson.endTime));
    }
    finishGroup();
    return output;
  }

  function renderWeekEvent(layoutItem) {
    const { lesson, lane = 0, laneCount = 1, hasOverlap = false } = layoutItem;
    const rangeStart = WEEK_START_HOUR * 60;
    const rangeEnd = WEEK_END_HOUR * 60;
    const lessonStart = timeToMinutes(lesson.startTime);
    const lessonEnd = timeToMinutes(lesson.endTime);
    const visibleStart = Math.max(rangeStart, lessonStart);
    const visibleEnd = Math.min(rangeEnd, lessonEnd);
    if (visibleEnd <= visibleStart) return "";
    const top = ((visibleStart - rangeStart) / 60) * WEEK_HOUR_HEIGHT;
    const height = Math.max(26, ((visibleEnd - visibleStart) / 60) * WEEK_HOUR_HEIGHT - 3);
    const student = lessonDisplayPerson(lesson);
    const color = calendarColorIndex(lesson.studentId || lesson.trial?.name);
    const cancelled = lesson.status === "cancelled" ? "cancelled" : "";
    const label = `${lesson.startTime} 到 ${lesson.endTime}，${student.name}，${lesson.subject}，${STATUS_LABELS[lesson.status] || lesson.status}`;
    const laneLeft = (lane / laneCount) * 100;
    const laneWidth = 100 / laneCount;
    return `<button class="week-event calendar-color-${color} ${cancelled} ${hasOverlap ? "has-overlap" : ""}" style="top:${top.toFixed(2)}px;height:${height.toFixed(2)}px;left:calc(${laneLeft}% + 1px);right:auto;width:calc(${laneWidth}% - 2px)" data-action="course-detail" data-id="${lesson.id}" aria-label="${escapeHtml(label)}">
      <span class="week-event-time">${escapeHtml(lesson.startTime)}</span>
      <span class="week-event-name">${escapeHtml(student.name)}</span>
      <span class="week-event-subject">${escapeHtml(lesson.subject)}</span>
    </button>`;
  }

  function renderWeekView() {
    const dates = weekDates(ui.selectedDate);
    const weekday = ["一", "二", "三", "四", "五", "六", "日"];
    const today = todayISO();
    const now = new Date();
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    const showNow = dates.includes(today) && nowMinutes >= WEEK_START_HOUR * 60 && nowMinutes <= WEEK_END_HOUR * 60;
    const timeLabels = Array.from({ length: WEEK_END_HOUR - WEEK_START_HOUR }, (_, index) => {
      const hour = WEEK_START_HOUR + index;
      return `<span class="week-time-label" style="top:${index * WEEK_HOUR_HEIGHT}px">${pad(hour)}:00</span>`;
    }).join("");
    const slotCount = (WEEK_END_HOUR - WEEK_START_HOUR) * 2;
    return `<div class="week-scroll" data-week-scroll aria-label="完整七天週課表">
      <div class="week-canvas">
        <div class="week-corner" aria-hidden="true"></div>
        ${dates.map((date, index) => {
          const day = parseISODate(date);
          return `<div class="week-day-head ${date === today ? "today" : ""}" style="grid-column:${index + 2};grid-row:1"><span>週${weekday[index]}</span><strong>${day.getDate()}</strong></div>`;
        }).join("")}
        <div class="week-time-axis">${timeLabels}</div>
        ${dates.map((date, index) => {
          const slots = Array.from({ length: slotCount }, (_, slotIndex) => {
            const startMinutes = WEEK_START_HOUR * 60 + slotIndex * 30;
            const startTime = `${pad(Math.floor(startMinutes / 60))}:${pad(startMinutes % 60)}`;
            return `<button class="week-slot" style="top:${slotIndex * WEEK_HOUR_HEIGHT / 2}px" data-action="add-calendar-lesson" data-calendar-date="${date}" data-start-time="${startTime}" aria-label="${formatDate(date)} ${startTime} 新增課程"></button>`;
          }).join("");
          const events = layoutWeekLessons(lessonsOn(date)).map(renderWeekEvent).join("");
          const nowLine = showNow && date === today ? `<div class="now-line" style="top:${((nowMinutes - WEEK_START_HOUR * 60) / 60) * WEEK_HOUR_HEIGHT}px" aria-hidden="true"></div>` : "";
          return `<div class="week-day-column ${date === today ? "today" : ""}" style="grid-column:${index + 2}" data-week-date="${date}">${slots}${events}${nowLine}</div>`;
        }).join("")}
      </div>
    </div>
    <p class="calendar-hint">完整顯示星期一至星期日與 08:00–23:00；點空白時段可直接新增課程。</p>`;
  }

  function calendarAgendaItem(lesson) {
    const student = studentById(lesson.studentId) || { name: "已刪除學生" };
    const color = calendarColorIndex(lesson.studentId);
    return `<button class="calendar-list-item calendar-color-${color} ${lesson.status === "cancelled" ? "cancelled" : ""}" data-action="course-detail" data-id="${lesson.id}" aria-label="開啟 ${escapeHtml(student.name)} 的課程操作">
      <span class="calendar-list-time"><strong>${escapeHtml(lesson.startTime)}</strong><span>– ${escapeHtml(lesson.endTime)}</span></span>
      <span class="calendar-list-info"><strong>${escapeHtml(student.name)}</strong><span>${escapeHtml(lesson.subject)}</span></span>
      ${statusBadge(lesson.status)}
    </button>`;
  }

  function renderDayAgenda() {
    const lessons = lessonsOn(ui.selectedDate);
    return `<section class="day-agenda" aria-label="當日課程">
      <div class="day-agenda-heading"><div><h2>當日課程</h2><span>${formatDate(ui.selectedDate)}</span></div><button class="mini-btn" data-action="add-calendar-lesson" data-calendar-date="${ui.selectedDate}">＋ 新增</button></div>
      ${lessons.length ? `<div class="calendar-list">${lessons.map(calendarAgendaItem).join("")}</div>` : `<div class="agenda-empty"><p>這天還沒有安排課程。</p><button class="btn btn-soft" data-action="add-calendar-lesson" data-calendar-date="${ui.selectedDate}">新增課程</button></div>`}
    </section>`;
  }

  function renderMonthView() {
    const dates = monthDates(ui.selectedDate);
    const currentMonth = ui.selectedDate.slice(0, 7);
    const today = todayISO();
    const lessonsByDate = new Map();
    for (const lesson of activeLessons()) {
      if (lesson.date >= dates[0] && lesson.date <= dates[dates.length - 1]) {
        if (!lessonsByDate.has(lesson.date)) lessonsByDate.set(lesson.date, []);
        lessonsByDate.get(lesson.date).push(lesson);
      }
    }
    for (const lessons of lessonsByDate.values()) lessons.sort((a, b) => a.startTime.localeCompare(b.startTime));
    return `<div class="month-weekdays" aria-hidden="true">${["日","一","二","三","四","五","六"].map(day => `<span>${day}</span>`).join("")}</div>
      <div class="month-grid" role="grid" aria-label="${calendarPeriodLabel()}">
        ${dates.map(date => {
          const day = parseISODate(date);
          const lessons = lessonsByDate.get(date) || [];
          const markers = lessons.slice(0, 3).map(lesson => `<span class="month-dot calendar-color-${calendarColorIndex(lesson.studentId)}" aria-hidden="true"></span>`).join("");
          const more = lessons.length > 3 ? `<span class="month-more">+${lessons.length - 3}</span>` : "";
          const label = `${formatDate(date)}${lessons.length ? `，${lessons.length} 堂課` : "，沒有課程"}`;
          return `<button class="month-day ${date.slice(0, 7) !== currentMonth ? "other-month" : ""} ${date === today ? "today" : ""} ${date === ui.selectedDate ? "selected" : ""}" data-date="${date}" role="gridcell" aria-selected="${date === ui.selectedDate}" aria-label="${label}">
            <span class="month-day-number">${day.getDate()}</span><span class="month-markers">${markers}${more}</span>
          </button>`;
        }).join("")}
      </div>
      ${renderDayAgenda()}`;
  }

  function renderSchedule() {
    return `
      ${topbar()}
      <main class="calendar-page">
        <div class="page-title-row"><h1>課表</h1><button class="btn btn-primary" data-action="add-calendar-lesson" data-calendar-date="${ui.selectedDate}">＋ 新增</button></div>
        ${renderCalendarSwitch()}
        ${renderCalendarToolbar()}
        ${ui.calendarView === "month" ? renderMonthView() : renderWeekView()}
      </main>
      ${bottomNav()}`;
  }

  function scrollWeekToRelevantDay() {
    const scroller = $("[data-week-scroll]");
    if (!scroller) return;
    scroller.scrollLeft = 0;
  }

  function studentCard(student) {
    const remaining = calculateRemainingLessons(student);
    const packageText = student.billingType === "perLesson" ? "按次計費" : `${student.usedLessons} / ${student.totalLessons} 堂`;
    const remainingText = remaining == null ? "不計堂數" : `${remaining} 堂`;
    return `<article class="student-card">
      <button class="card-hit" data-action="open-student" data-id="${student.id}">
        <div class="student-head"><div class="avatar">${escapeHtml(initials(student.name))}</div><div><h3>${escapeHtml(student.name)}</h3><div class="lesson-meta">${escapeHtml(student.subject)}${student.phone ? ` · ${escapeHtml(student.phone)}` : ""}</div></div></div>
        <div class="student-stats"><div class="stat-box"><small>已上／總堂數</small><strong>${packageText}</strong></div><div class="stat-box"><small>剩餘堂數</small><strong>${remainingText}</strong></div></div>
        ${remaining !== null && remaining <= 2 ? `<div class="warning">⚠ 即將用完</div>` : ""}
      </button>
    </article>`;
  }

  function renderStudents() {
    const term = ui.search.trim().toLowerCase();
    const students = state.students.filter(s => !term || `${s.name} ${s.subject} ${s.phone || ""}`.toLowerCase().includes(term));
    return `
      ${topbar()}
      <div class="page-title-row"><h1>學生</h1><button class="btn btn-primary" data-action="add-student">＋ 新增</button></div>
      <div class="search-row"><input id="student-search" type="search" placeholder="搜尋姓名、科目或電話" value="${escapeHtml(ui.search)}" aria-label="搜尋學生" /></div>
      <div class="card-list">${students.length ? students.map(studentCard).join("") : emptyState("找不到學生", term ? "換個關鍵字試試看。" : "先新增第一位學生吧。", term ? "" : "新增學生", "add-student")}</div>
      ${bottomNav()}`;
  }

  function renderStudentDetail(studentId) {
    const student = studentById(studentId);
    if (!student) {
      ui.studentDetailId = null;
      ui.tab = "students";
      return renderStudents();
    }
    const remaining = calculateRemainingLessons(student);
    const lessons = activeLessons().filter(l => l.studentId === student.id).sort((a, b) => `${b.date}${b.startTime}`.localeCompare(`${a.date}${a.startTime}`));
    const records = lessons.map(l => ({ lesson: l, record: recordByLessonId(l.id) })).filter(x => x.record);
    const transactions = (state.lessonCreditTransactions || [])
      .filter(transaction => transaction.studentId === student.id)
      .sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    return `
      <div class="page-title-row"><button class="back-btn" data-action="back-students" aria-label="返回學生列表">←</button><h1 style="flex:1;text-align:center">學生資料</h1><span style="width:42px"></span></div>
      <section class="detail-hero">
        <div class="detail-title"><div class="avatar">${escapeHtml(initials(student.name))}</div><div><h1>${escapeHtml(student.name)}</h1><div class="lesson-meta">${escapeHtml(student.subject)}${student.phone ? ` · ${escapeHtml(student.phone)}` : ""}</div></div></div>
        <div class="detail-grid">
          <div class="info-cell"><small>已上堂數</small><strong>${student.usedLessons}</strong></div>
          <div class="info-cell"><small>剩餘堂數</small><strong>${remaining == null ? "按次計費" : remaining}</strong></div>
          <div class="info-cell"><small>購買總堂數</small><strong>${student.totalLessons == null ? "—" : student.totalLessons}</strong></div>
          <div class="info-cell"><small>每堂費用</small><strong>${money(student.pricePerLesson)}</strong></div>
        </div>
        <div class="detail-actions"><button class="btn btn-soft" data-action="edit-student" data-id="${student.id}">編輯資料</button><button class="btn btn-primary" data-action="add-lesson" data-student-id="${student.id}">新增課程</button>${student.billingType === "package" ? `<button class="btn btn-soft" style="grid-column:1/-1" data-action="add-credit" data-id="${student.id}">＋ 新增堂數</button>` : ""}</div>
        ${student.contactNote ? `<p class="lesson-meta" style="margin:14px 2px 0">聯絡備註：${escapeHtml(student.contactNote)}</p>` : ""}
        ${student.notes ? `<p class="lesson-meta" style="margin:8px 2px 0">學生備註：${escapeHtml(student.notes)}</p>` : ""}
      </section>
      <section class="section"><div class="section-heading"><h2>上課紀錄</h2><span class="subtle">${records.length} 筆</span></div>
      <div class="card-list">${records.length ? records.map(({ lesson, record }) => `<article class="record-card"><button class="card-hit" style="width:100%;border:0;background:transparent;text-align:left;padding:0" data-action="edit-record" data-id="${lesson.id}"><div class="record-row"><div><h3>${formatShortDate(lesson.date)} · ${lesson.startTime}</h3><div class="lesson-meta">${escapeHtml(lesson.subject)} · ${record.deductLesson ? "有扣堂" : "未扣堂"}</div></div>${statusBadge(record.status)}</div>${record.note ? `<p>${escapeHtml(record.note)}</p>` : ""}</button></article>`).join("") : emptyState("還沒有上課紀錄", "完成課程後，紀錄會自動出現在這裡。")}</div></section>
      ${student.billingType === "package" ? `<section class="section"><div class="section-heading"><h2>堂數異動</h2><span class="subtle">${transactions.length} 筆</span></div>
        <div class="card-list">${transactions.length ? transactions.map(transaction => `<article class="record-card"><div class="record-row"><div><h3>${escapeHtml(CREDIT_TYPE_LABELS[transaction.type] || transaction.type)}${transaction.reversedAt ? "（已撤銷）" : ""}</h3><div class="lesson-meta">${escapeHtml(new Date(transaction.createdAt).toLocaleString("zh-TW"))}${transaction.reason ? ` · ${escapeHtml(transaction.reason)}` : ""}</div></div><strong style="color:${transaction.amount >= 0 ? "var(--green)" : "var(--red)"}">${transaction.amount > 0 ? "+" : ""}${transaction.amount}</strong></div></article>`).join("") : emptyState("還沒有堂數異動", "新增堂數或完成扣堂後會顯示在這裡。")}</div>
      </section>` : ""}
      ${bottomNav()}`;
  }

  function renderMore() {
    const profile = state.teacherProfile || defaultTeacherProfile();
    const profileMeta = profile.subjects.length ? profile.subjects.join("、") : "尚未設定授課科目";
    return `
      ${topbar()}
      <div class="page-title-row"><h1>更多</h1></div>
      <section class="detail-hero"><div class="detail-title"><div class="avatar">${escapeHtml(initials(profile.name))}</div><div><h1>${escapeHtml(profile.name)}</h1><div class="lesson-meta">${escapeHtml(profileMeta)}</div></div></div></section>

          <button class="settings-item" data-action="install-app"><span><strong>安裝到手機</strong><br><small>加入主畫面，像 App 一樣開啟並支援離線</small></span><span>›</span></button>
        </div>
      </section>
      <section class="section"><div class="section-heading"><h2>資料備份</h2></div>
        <div class="settings-card">
          <button class="settings-item" data-action="export-json"><span><strong>下載完整備份（JSON）</strong><br><small>包含老師、學生、課程與堂數紀錄</small></span><span>↓</span></button>
          <button class="settings-item" data-action="export-csv"><span><strong>下載課程明細（CSV）</strong><br><small>可用 Excel 或 Google 試算表開啟</small></span><span>↓</span></button>
          <button class="settings-item" data-action="import-data"><span><strong>匯入資料</strong><br><small>選擇先前匯出的 JSON</small></span><span>›</span></button>
          <button class="settings-item" data-action="reset-demo"><span><strong>重新載入示範資料</strong><br><small>會覆蓋目前資料</small></span><span>›</span></button>
          <button class="settings-item" data-action="clear-data"><span style="color:var(--red)"><strong>清除全部資料</strong><br><small>此操作無法復原</small></span><span>›</span></button>
        </div>
        <p class="export-note">CSV 僅包含課程明細，不會匯出老師電話、Email 或其他聯絡資料。</p>
      </section>
      <input class="file-input" id="import-file" type="file" accept="application/json,.json" />
      <div class="version">小課表 MVP ${APP_VERSION}</div>
      ${bottomNav()}`;

  function render() {
    const app = $("#app");
    if (ui.studentDetailId) app.innerHTML = renderStudentDetail(ui.studentDetailId);
    else if (ui.tab === "schedule") app.innerHTML = renderSchedule();
    else if (ui.tab === "students") app.innerHTML = renderStudents();
    else if (ui.tab === "more") app.innerHTML = renderMore();
    else app.innerHTML = renderHome();
    if (ui.tab === "schedule" && !ui.studentDetailId && ui.calendarView === "week") {
      requestAnimationFrame(scrollWeekToRelevantDay);
    }
  }

  function openSheet(title, bodyHtml, onReady) {
    const root = $("#overlay-root");
    root.innerHTML = `<div class="sheet-backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="sheet-handle"></div><div class="sheet-header"><h2>${escapeHtml(title)}</h2><button class="close-btn" data-action="close-sheet" aria-label="關閉">✕</button></div>${bodyHtml}</section></div>`;
    const sheet = $(".sheet", root);
    const backdrop = $(".sheet-backdrop", root);
    backdrop.addEventListener("click", e => {
      if (e.target === backdrop) closeSheet();
    });
    if (onReady) onReady(root);
    const firstInput = $("input, select, textarea, button", sheet);
    if (firstInput) setTimeout(() => firstInput.focus(), 20);
  }

  function closeSheet() { $("#overlay-root").innerHTML = ""; }

  async function installApp() {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      if (choice.outcome === "accepted") toast("小課表正在安裝到手機");
      return;
    }

    openSheet("安裝到手機", `
      <div class="form-grid">
        <section class="detail-hero">
          <h3 style="margin:0 0 8px">iPhone／iPad（Safari）</h3>
          <p style="margin:0;color:var(--muted);line-height:1.7">點 Safari 下方的「分享」按鈕，再選「加入主畫面」。</p>
        </section>
        <section class="detail-hero">
          <h3 style="margin:0 0 8px">Android（Chrome）</h3>
          <p style="margin:0;color:var(--muted);line-height:1.7">點右上角選單，再選「安裝應用程式」或「加到主畫面」。</p>
        </section>
        <p class="export-note">請先從 GitHub Pages 的 HTTPS 網址開啟；直接開啟本機檔案時無法安裝或離線使用。</p>
        <button class="btn btn-primary" type="button" data-action="close-sheet">知道了</button>
      </div>`);
  }

  function teacherProfileForm() {
    const profile = normalizeTeacherProfile(state.teacherProfile);
    openSheet("老師資訊", `
      <form id="teacher-profile-form" class="form-grid" novalidate>
        <div class="field"><label for="teacher-name">老師姓名 *</label><input id="teacher-name" name="name" value="${escapeHtml(profile.name)}" required /><div class="form-error" data-error="name"></div></div>
        <div class="form-row">
          <div class="field"><label for="teacher-phone">聯絡電話</label><input id="teacher-phone" name="phone" inputmode="tel" value="${escapeHtml(profile.phone)}" /></div>
          <div class="field"><label for="teacher-line">LINE ID／其他聯絡</label><input id="teacher-line" name="lineId" value="${escapeHtml(profile.lineId)}" /></div>
        </div>
        <div class="field"><label for="teacher-email">Email</label><input id="teacher-email" name="email" type="email" value="${escapeHtml(profile.email)}" autocomplete="email" /><div class="form-error" data-error="email"></div></div>
        <div class="field"><label for="teacher-subjects">授課科目</label><input id="teacher-subjects" name="subjects" value="${escapeHtml(profile.subjects.join("、"))}" placeholder="例如：數學、英文、物理" /><div class="teacher-subject-help">可用頓號、逗號或換行分隔多個科目。</div></div>
        <div class="field"><label>預設授課方式</label><div class="segmented segmented-3">
          <label><input type="radio" name="defaultLessonMode" value="" ${profile.defaultLessonMode === "" ? "checked" : ""}><span>未指定</span></label>
          <label><input type="radio" name="defaultLessonMode" value="inPerson" ${profile.defaultLessonMode === "inPerson" ? "checked" : ""}><span>實體</span></label>
          <label><input type="radio" name="defaultLessonMode" value="online" ${profile.defaultLessonMode === "online" ? "checked" : ""}><span>線上</span></label>
        </div></div>
        <div class="field"><label for="teacher-location">預設地點或線上連結</label><input id="teacher-location" name="defaultLocation" value="${escapeHtml(profile.defaultLocation)}" placeholder="例如：老師家、Google Meet" /></div>
        <div class="field"><label for="teacher-duration">預設課程時長</label><select id="teacher-duration" name="defaultDuration">${[30,45,60,90,120].map(duration => `<option value="${duration}" ${profile.defaultDuration === duration ? "selected" : ""}>${duration} 分鐘</option>`).join("")}</select></div>
        <div class="field"><label for="teacher-note">備註</label><textarea id="teacher-note" name="note">${escapeHtml(profile.note)}</textarea></div>
        <div class="sheet-footer"><button class="btn btn-primary btn-full" type="submit">儲存老師資訊</button></div>
      </form>`, root => {
        const form = $("#teacher-profile-form", root);
        form.addEventListener("submit", event => {
          event.preventDefault();
          const data = new FormData(form);
          const name = String(data.get("name") || "").trim();
          const email = String(data.get("email") || "").trim();
          $('[data-error="name"]', form).textContent = "";
          $('[data-error="email"]', form).textContent = "";
          let valid = true;
          if (!name) {
            $('[data-error="name"]', form).textContent = "請輸入老師姓名";
            valid = false;
          }
          if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            $('[data-error="email"]', form).textContent = "Email 格式不正確";
            valid = false;
          }
          if (!valid) return;
          state.teacherProfile = normalizeTeacherProfile({
            name,
            phone: data.get("phone"),
            email,
            lineId: data.get("lineId"),
            subjects: String(data.get("subjects") || "").split(/[,，、\n]/),
            defaultLessonMode: data.get("defaultLessonMode"),
            defaultLocation: data.get("defaultLocation"),
            defaultDuration: Number(data.get("defaultDuration")),
            note: data.get("note"),
            updatedAt: new Date().toISOString(),
          });
          saveData();
          closeSheet();
          render();
          toast("老師資訊已儲存");
        });
      });
  }

        : "";
    openSheet("課程操作", `
      <section class="detail-hero">
        <div class="record-row"><div><h3 style="margin:0 0 5px">${escapeHtml(student.name)} · ${escapeHtml(lesson.subject)}</h3><div class="lesson-meta">${formatDate(lesson.date)} · ${escapeHtml(lesson.startTime)}–${escapeHtml(lesson.endTime)}</div></div>${statusBadge(lesson.status)}</div>
        <p class="lesson-meta" style="margin:12px 0 0">${lesson.mode === "online" ? "線上" : "實體"} · ${escapeHtml(place)}</p>
        ${lesson.lessonType === "trial" ? `<p class="lesson-meta" style="margin:7px 0 0">試教結果：${escapeHtml(TRIAL_RESULT_LABELS[lesson.trial?.result] || "待確認")}${lesson.trial?.source ? ` · 來源：${escapeHtml(lesson.trial.source)}` : ""}${lesson.trial?.fee ? ` · ${money(lesson.trial.fee)}` : ""}</p>` : ""}

        ${primaryAction ? `<div class="detail-actions">${primaryAction}</div>` : ""}

          <button class="btn btn-soft" data-action="edit-lesson" data-id="${lesson.id}">編輯課程</button>
          <button class="btn btn-soft" data-action="copy-lesson" data-id="${lesson.id}">複製課程</button>
          ${lesson.lessonType === "trial" && !lesson.trial?.convertedStudentId ? `<button class="btn btn-primary" style="grid-column:1/-1" data-action="convert-trial" data-id="${lesson.id}">轉為正式學生</button>` : ""}
          <button class="btn btn-ghost" style="grid-column:1/-1" data-action="lesson-more" data-id="${lesson.id}">${lesson.recordId ? "查看／修改上課紀錄" : "完成、請假、改期或取消"}</button>
          <button class="btn btn-danger" style="grid-column:1/-1" data-action="delete-lesson" data-id="${lesson.id}">刪除課程</button>
        </div>

  function restoreDeletedLesson(lessonId) {
    try {

          <div class="status-options">
            <label class="status-option"><input type="radio" name="creditChoice" value="restore" checked><span>刪除並加回 1 堂</span></label>
            <label class="status-option"><input type="radio" name="creditChoice" value="keep"><span>僅刪除，不調整堂數</span></label>

        <div class="toggle-row"><div><strong>建立每週固定課程</strong><div class="lesson-meta">沿用試教的星期與時間，衝堂時往後補足</div></div><label class="toggle"><input id="convert-create-schedule" name="createSchedule" type="checkbox" checked><span class="slider"></span></label></div>
        <div id="convert-schedule-fields" class="form-grid">

          <div class="field"><label for="convert-count">先排幾堂（1～100）</label><input id="convert-count" name="scheduleCount" type="number" min="1" max="100" step="1" value="4"></div>
        </div>
        <div class="form-error" data-error="form"></div>
        <div class="sheet-footer"><button class="btn btn-primary btn-full" type="submit">建立正式學生</button></div>
      </form>`, root => {
        const form = $("#convert-trial-form", root);
        const scheduleToggle = $("#convert-create-schedule", root);
        scheduleToggle.addEventListener("change", () => {
          $("#convert-schedule-fields", root).style.display = scheduleToggle.checked ? "grid" : "none";
        });
        let submitting = false;
        form.addEventListener("submit", event => {
          event.preventDefault();
          if (submitting) return;
          const fd = new FormData(form);
          const name = String(fd.get("name") || "").trim();
          const subject = String(fd.get("subject") || "").trim();
          const credits = Number(fd.get("credits"));
          const scheduleCount = Number(fd.get("scheduleCount"));
          const createSchedule = fd.get("createSchedule") === "on";
          const startTime = String(fd.get("startTime") || "");
          const endTime = String(fd.get("endTime") || "");
          const error = $('[data-error="form"]', form);
          error.textContent = "";
          if (!name || !subject) { error.textContent = "請填寫姓名與正式科目"; return; }
          if (!Number.isInteger(credits) || credits < 1 || credits > 999) { error.textContent = "初始堂數必須是 1～999 的整數"; return; }
          if (createSchedule && (!Number.isInteger(scheduleCount) || scheduleCount < 1 || scheduleCount > 100)) { error.textContent = "排課堂數必須是 1～100 的整數"; return; }
          if (createSchedule && timeToMinutes(endTime) <= timeToMinutes(startTime)) { error.textContent = "結束時間必須晚於開始時間"; return; }
          submitting = true;
          const submitButton = $('button[type="submit"]', form);
          submitButton.disabled = true;
          try {
            const now = new Date().toISOString();
            const student = {
              id: uid("stu"),
              name,
              subject,
              phone: "",
              contactNote: String(fd.get("contact") || "").trim(),
              billingType: "package",
              totalLessons: credits,
              usedLessons: 0,
              pricePerLesson: fd.get("price") ? Number(fd.get("price")) : null,
              defaultDuration: Math.max(30, timeToMinutes(lesson.endTime) - timeToMinutes(lesson.startTime)),
              notes: `由 ${formatDate(lesson.date)} 試教轉為正式學生`,
              isDemoData: Boolean(lesson.isDemoData),
              createdAt: now,
              updatedAt: now,
            };
            state.students.push(student);
            Domain.addCreditTransaction(state, {
              id: uid("credit"),
              studentId: student.id,
              type: "purchase",
              amount: credits,
              reason: "試教轉正式的初始堂數",
              createdAt: now,
              isDemoData: Boolean(lesson.isDemoData),
            });
            if (fd.get("includeTrial") === "on") {
              lesson.studentId = student.id;
              let trialRecord = recordByLessonId(lesson.id);
              if (!trialRecord) {
                trialRecord = { id: uid("record"), lessonId: lesson.id, studentId: student.id, status: "completed", deductLesson: true, note: "試教轉正式時明確計入堂數", deletedAt: null, recordedAt: now, updatedAt: now, isDemoData: Boolean(lesson.isDemoData) };
                state.lessonRecords.push(trialRecord);
                lesson.recordId = trialRecord.id;
                lesson.status = "completed";
              } else {
                trialRecord.studentId = student.id;
                trialRecord.deductLesson = true;
                trialRecord.updatedAt = now;
              }
              Domain.addCreditTransaction(state, {
                id: uid("credit"),
                studentId: student.id,
                type: "deduction",
                amount: -1,
                reason: "老師選擇將試教計入正式堂數",
                relatedLessonId: lesson.id,
                createdAt: now,
                isDemoData: Boolean(lesson.isDemoData),
              });
              Domain.syncStudentUsedLessons(state, student.id);
            }
            if (createSchedule) {
              const baseLesson = {
                id: uid("lesson"),
                studentId: student.id,
                subject,
                date: String(fd.get("date")),
                startTime,
                endTime,
                mode: lesson.mode,
                location: lesson.location,
                lessonType: "formal",
                trial: null,
                recurrenceGroupId: null,
                status: "scheduled",
                startedAt: null,
                recordId: null,
                notes: "",
                isDemoData: Boolean(lesson.isDemoData),
                createdAt: now,
                updatedAt: now,
              };
              const plan = Domain.planRecurrence({
                startDate: baseLesson.date,
                weekdays: [weekdayNumber(baseLesson.date)],
                targetCount: scheduleCount,
                baseLesson,
              }, state.lessons, { autoSupplement: true, maxWeeks: 104 });
              if (plan.limitReached) throw new Error("104 週內無法補足固定課程，請調整日期或時間");
              state.lessons.push(...materializeRecurringLessons(baseLesson, plan.accepted));
            }
            lesson.trial.result = "converted";
            lesson.trial.convertedStudentId = student.id;
            lesson.updatedAt = now;
            saveData();
            closeSheet();
            ui.tab = "students";
            ui.studentDetailId = student.id;
            render();
            toast(`已將 ${student.name} 轉為正式學生`);
          } catch (errorValue) {
            submitting = false;
            submitButton.disabled = false;
            error.textContent = errorValue.message || "轉為正式學生失敗";
          }
        });
      });
  }

  function creditSheet(student) {
    if (!student || student.billingType !== "package") return;
    const current = calculateRemainingLessons(student);
    const presets = [1, 2, 4, 8, 12, 16, 20];
    openSheet("新增堂數", `
      <form id="credit-form" class="form-grid" novalidate>
        <div class="detail-hero" style="margin:0"><div class="record-row"><div><strong>${escapeHtml(student.name)}</strong><div class="lesson-meta">目前剩餘堂數</div></div><strong>${current}</strong></div></div>

        <div class="field" id="custom-credit-field" hidden><label for="custom-credit">自訂堂數（1～999）</label><input id="custom-credit" name="customCredit" type="number" min="1" max="999" step="1" inputmode="numeric" value="1"><div class="form-error" data-error="amount"></div></div>
        <div class="field"><label for="credit-type">異動類型</label><select id="credit-type" name="type"><option value="purchase">購買</option><option value="gift">贈送</option><option value="manualAdjustment">人工修正</option></select></div>
        <div class="field"><label for="credit-reason">原因／備註</label><input id="credit-reason" name="reason" maxlength="500" placeholder="例如：購買 4 堂方案"></div>
        <div id="credit-preview" class="repeat-summary" aria-live="polite"></div>
        <div class="sheet-footer"><button class="btn btn-primary btn-full" type="submit">確認新增</button></div>
      </form>`, root => {
        const form = $("#credit-form", root);
        const customField = $("#custom-credit-field", root);
        const customInput = $("#custom-credit", root);
        let selected = 4;
        let submitting = false;
        const amount = () => selected === "custom" ? Number(customInput.value) : Number(selected);
        const updatePreview = () => {
          const value = amount();
          const valid = Number.isInteger(value) && value >= 1 && value <= 999;
          $("#credit-preview", root).innerHTML = valid
            ? `本次新增 <strong>${value}</strong> 堂<br>新增後剩餘 <strong>${current + value}</strong> 堂`
            : "請輸入 1～999 的整數";
        };
        $$("[data-credit-value]", root).forEach(button => button.addEventListener("click", () => {
          selected = button.dataset.creditValue === "custom" ? "custom" : Number(button.dataset.creditValue);
          $$("[data-credit-value]", root).forEach(item => item.classList.toggle("active", item === button));
          customField.hidden = selected !== "custom";
          if (selected === "custom") customInput.focus();
          updatePreview();
        }));
        customInput.addEventListener("input", updatePreview);
        updatePreview();
        form.addEventListener("submit", event => {
          event.preventDefault();
          if (submitting) return;
          const value = amount();
          const error = $('[data-error="amount"]', form);
          error.textContent = "";
          if (!Number.isInteger(value) || value < 1 || value > 999) {
            error.textContent = "自訂堂數只能輸入 1～999 的整數";
            return;
          }
          submitting = true;
          const button = $('button[type="submit"]', form);
          button.disabled = true;
          try {
            const now = new Date().toISOString();
            Domain.addCreditTransaction(state, {
              id: uid("credit"),
              studentId: student.id,
              type: String(new FormData(form).get("type")),
              amount: value,

              createdAt: now,
              isDemoData: Boolean(student.isDemoData),

            student.totalLessons = Number(student.totalLessons || 0) + value;
            student.updatedAt = now;
            saveData();
            closeSheet();
            ui.studentDetailId = student.id;
            render();

            submitting = false;
            button.disabled = false;
            error.textContent = errorValue.message || "新增堂數失敗";
          }
        });
      });
  }

  function addMinutes(time, minutes) {
    let total = timeToMinutes(time) + minutes;
    total = Math.min(total, 23 * 60 + 59);
    return `${pad(Math.floor(total / 60))}:${pad(total % 60)}`;
  }
