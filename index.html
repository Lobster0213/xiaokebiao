  async function sendCreditBalanceRemindersIfNeeded() {
    const notifications = state.settings.notifications || (state.settings.notifications = {});
    const tracker = notifications.creditBalanceReminders && typeof notifications.creditBalanceReminders === "object"
      ? notifications.creditBalanceReminders
      : (notifications.creditBalanceReminders = {});
    const activeStudentIds = new Set(activeStudents().filter(student => student.billingType === "package").map(student => student.id));
    let changed = false;
    const pending = [];

    for (const studentId of Object.keys(tracker)) {
      if (!activeStudentIds.has(studentId)) {
        delete tracker[studentId];
        changed = true;
      }
    }

    for (const student of activeStudents().filter(item => item.billingType === "package")) {
      const balance = calculateRemainingLessons(student);
      if (!Number.isFinite(balance)) continue;
      const previous = tracker[student.id] && typeof tracker[student.id] === "object" ? tracker[student.id] : null;
      const transition = Domain.creditReminderTransition(previous, balance);
      if (transition.shouldNotify) {
        pending.push({ student, balance });
      }

      const next = transition.state;
      if (!previous || previous.lastBalance !== next.lastBalance || JSON.stringify(previous.notifiedLevels || []) !== JSON.stringify(next.notifiedLevels)) {
        tracker[student.id] = next;
        changed = true;
      }
    }

    if (pending.length) {
      const body = pending.length === 1
        ? (pending[0].balance === 0 ? `${pending[0].student.name}的堂數已用完` : `${pending[0].student.name}剩餘 1 堂`)
        : pending.slice(0, 3).map(item => `${item.student.name} ${item.balance} 堂`).join("、") + (pending.length > 3 ? `，另有 ${pending.length - 3} 位` : "");
      for (const item of pending) {
        const itemBody = item.balance === 0 ? `${item.student.name}的堂數已用完` : `${item.student.name}剩餘 1 堂`;
        addInboxNotification({
          type: "credit",
          title: "堂數提醒",
          body: itemBody,
          studentId: item.student.id,
          balance: item.balance,
        }, { save: false });
        const reminder = tracker[item.student.id];
        reminder.notifiedLevels = [...new Set([...(reminder.notifiedLevels || []), item.balance])];
      }
      changed = true;
      await showAppNotification("小課表堂數提醒", body, "xiaokebiao-credit-balance")
        .catch(error => console.warn("顯示堂數通知失敗", error));
    }

    if (changed) saveData({ checkCreditReminders: false });
  }

  function downloadBlobFile(parts, type, filename) {
    const blob = new Blob(parts, { type });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    try {
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
    } finally {
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    }
  }

  function downloadJsonFile(data, filename) {
    downloadBlobFile([JSON.stringify(data, null, 2)], "application/json;charset=utf-8", filename);
  }

  function escapeCsvCell(value) {
    return Domain.sanitizeCsvCell(value);
  }

  function downloadCsvFile(rows, filename) {
    const csv = rows.map(row => row.map(escapeCsvCell).join(",")).join("\r\n");
    downloadBlobFile(["\ufeff", csv], "text/csv;charset=utf-8", filename);
  }

        <div class="sheet-footer"><button id="clear-all-submit" class="btn btn-danger btn-full" type="submit" disabled>永久清除小課表資料</button></div>
      </form>`, root => {
        const form = $("#clear-all-form", root);
        const input = $("#clear-confirmation", root);
        const button = $("#clear-all-submit", root);
        input.addEventListener("input", () => { button.disabled = input.value !== "確認清除"; });
        form.addEventListener("submit", event => {
          event.preventDefault();
          if (input.value !== "確認清除" || button.disabled) return;
          button.disabled = true;
          invalidStoredData = null;
          try {
            const keysToRemove = [];
            for (let index = 0; index < localStorage.length; index += 1) {
              const key = localStorage.key(index);
              if (key === `${STORAGE_KEY}_recovery` || key?.startsWith(`${STORAGE_KEY}_migration_backup_`)) keysToRemove.push(key);
            }
            keysToRemove.forEach(key => localStorage.removeItem(key));
            localStorage.removeItem(CALENDAR_VIEW_KEY);
            state = Domain.normalizeData({
              teacherProfile: defaultTeacherProfile(),
              students: [],
              lessons: [],
              lessonRecords: [],
              lessonCreditTransactions: [],
              settings: { ...Domain.defaultSettings(true), hasCompletedOnboarding: true, onboardingVersion: Domain.ONBOARDING_VERSION },
              dataVersion: DATA_VERSION,
              version: APP_VERSION,
            }, { existingUser: true });
            saveData();
            closeSheet();
            ui = createUIState();
            render();
            toast("小課表內的資料已全部清除");
          } catch (error) {
            button.disabled = false;
            toast(error.message || "清除資料失敗", "error");
          }
        });
      });
  }

  function resetDemo() {
    if (!confirm("重新載入示範資料會覆蓋目前內容，確定繼續嗎？")) return;
    state = createDemoData(); saveData(); ui = createUIState(); render(); toast("示範資料已重新載入");
  }

  document.addEventListener("click", e => {
    const tab = e.target.closest("[data-tab]");
    if (tab) {
      ui.tab = tab.dataset.tab; ui.studentDetailId = null; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return;
    }
    const calendarView = e.target.closest("[data-calendar-view]");
    if (calendarView) {
      ui.calendarView = calendarView.dataset.calendarView === "month" ? "month" : "week";
      saveCalendarView(ui.calendarView);
      render();
      return;
    }
    const date = e.target.closest("[data-date]");
    if (date) { ui.selectedDate = date.dataset.date; render(); return; }
    const actionEl = e.target.closest("[data-action]");
    if (!actionEl) return;
    const action = actionEl.dataset.action;
    const id = actionEl.dataset.id;
    if (action === "notification-center") openNotificationCenter();
    else if (action === "notify") requestNotificationPermission();
    else if (action === "add-student") studentForm();
    else if (action === "edit-student") studentForm(studentById(id));
    else if (action === "view-archived-students") archivedStudentsSheet();
    else if (action === "view-archived-student") { closeSheet(); ui.studentDetailId = id; ui.tab = "students"; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else if (action === "restore-student") restoreStudent(id);
    else if (action === "delete-student") studentDeleteSheet(studentById(id));
    else if (action === "archive-student") studentArchiveSheet(studentById(id));
    else if (action === "archive-student-from-edit") { closeSheet(); studentArchiveSheet(studentById(id)); }
    else if (action === "confirm-archive-student") archiveStudent(id, actionEl.dataset.refund === "true");
    else if (action === "confirm-delete-empty-student") deleteStudent(id, false);
    else if (action === "confirm-delete-student-future") deleteStudent(id, true);
    else if (action === "add-credit") creditSheet(studentById(id));
    else if (action === "edit-teacher") teacherProfileForm();
    else if (action === "deduction-policy") deductionPolicySheet();
    else if (action === "student-deduction-policy") studentDeductionPolicySheet(studentById(id));
    else if (action === "show-guide") showGuide();
    else if (action === "restart-onboarding") showOnboarding(1);
    else if (action === "clear-demo") { if (confirm("只清除標示為示範的資料？你自行建立的內容會保留。")) clearDemoData(); }
    else if (action === "install-app") installApp();
    else if (action === "check-update") callAndroidUpdater("checkForUpdates");
    else if (action === "download-update") { closeSheet(); callAndroidUpdater("downloadAndInstall"); }
    else if (action === "continue-update") callAndroidUpdater("continueInstall");
    else if (action === "dismiss-update") closeSheet();
    else if (action === "apply-pwa-update") applyPwaUpdate();
    else if (action === "dismiss-pwa-update") { pwaUpdateDismissed = true; closeSheet(); }
    else if (action === "enable-web-push") enableWebPush();
    else if (action === "disable-web-push") disableWebPush();
    else if (action === "test-local-push") showLocalPushTest();
    else if (action === "add-lesson") lessonForm(null, actionEl.dataset.studentId || null);
    else if (action === "add-calendar-lesson") {
      const date = actionEl.dataset.calendarDate || ui.selectedDate;
      ui.selectedDate = date;
      lessonForm(null, null, null, { date, startTime: actionEl.dataset.startTime || null });
    }
    else if (action === "course-detail") courseDetailSheet(lessonById(id));
    else if (action === "delete-lesson") deleteSeriesLessonSheet(lessonById(id));
    else if (action === "skip-series") skipSeriesSheet(lessonById(id));
    else if (action === "add-series-lessons") addSeriesLessonsSheet(lessonById(id));
    else if (action === "convert-trial") convertTrialSheet(lessonById(id));
    else if (action === "edit-lesson") { const target = lessonById(id); if (target?.recurrenceGroupId) seriesEditSheet(target); else lessonForm(target); }
    else if (action === "reschedule-lesson") lessonForm(lessonById(id), null, null, { reschedule: true });
    else if (action === "copy-lesson") { const source = lessonById(id); if (source) lessonForm(null, source.studentId, source); }
    else if (action === "start-lesson") { closeSheet(); startLesson(id); }
    else if (action === "quick-complete") { closeSheet(); quickCompleteLesson(id); }
    else if (action === "lesson-more" || action === "complete-lesson" || action === "edit-record") { const lesson = lessonById(id); if (lesson) recordSheet(lesson); }
    else if (action === "open-student") { ui.studentDetailId = id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else if (action === "back-students") { ui.studentDetailId = null; ui.tab = "students"; render(); }
    else if (action === "go-schedule") { ui.tab = "schedule"; ui.studentDetailId = null; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else if (action === "schedule-filter") scheduleFilterSheet();
    else if (action === "clear-schedule-filter") { ui.scheduleFilters = { studentId: "", subject: "", status: "" }; closeSheet(); render(); }
    else if (action === "date-prev") { ui.selectedDate = addDays(ui.selectedDate, -1); render(); }
    else if (action === "date-next") { ui.selectedDate = addDays(ui.selectedDate, 1); render(); }
    else if (action === "calendar-prev") { ui.selectedDate = ui.calendarView === "month" ? addMonths(ui.selectedDate, -1) : addDays(ui.selectedDate, -7); render(); }
    else if (action === "calendar-next") { ui.selectedDate = ui.calendarView === "month" ? addMonths(ui.selectedDate, 1) : addDays(ui.selectedDate, 7); render(); }
    else if (action === "calendar-today") { ui.selectedDate = todayISO(); render(); }
    else if (action === "close-sheet") closeSheet();
    else if (action === "export-json" || action === "export-data") exportJsonBackup();
    else if (action === "export-csv") exportLessonCsv();
    else if (action === "export-recovery") exportRecoveryBackup();
    else if (action === "import-data") $("#import-file")?.click();
    else if (action === "clear-data") clearAllData();
    else if (action === "reset-demo") resetDemo();
  });

  document.addEventListener("input", e => {
    if (e.target.id === "student-search") {
      ui.search = e.target.value;
      const cursor = e.target.selectionStart;
      render();
      const input = $("#student-search");
      if (input) { input.focus(); input.setSelectionRange(cursor, cursor); }
    }
  });

  document.addEventListener("change", e => {
    if (e.target.id === "android-auto-check") {
      state.settings.update.autoCheck = e.target.checked;
      saveData();
      callAndroidUpdater("setAutoCheck", e.target.checked);
      return;
    }
    if (e.target.id === "android-wifi-only") {
      state.settings.update.wifiOnly = e.target.checked;
      saveData();
      callAndroidUpdater("setWifiOnly", e.target.checked);
      return;
    }
    if (e.target.id === "import-file") {
      const file = e.target.files?.[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        toast("匯入失敗：檔案不可超過 5 MB", "error");
        e.target.value = "";
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const previousRaw = localStorage.getItem(STORAGE_KEY) || JSON.stringify(state);
        const snapshotKey = `${STORAGE_KEY}_import_snapshot_${Date.now()}`;
        try {
          localStorage.setItem(snapshotKey, previousRaw);
          const parsed = JSON.parse(reader.result);
          const normalized = normalizeStoredData(parsed, { existingUser: true });
          if (!validateImportedData(normalized)) throw new Error("資料格式不正確");
          normalized.settings.backup = {
            ...(normalized.settings.backup || {}),
            lastImportSnapshotAt: new Date().toISOString(),
          };
          const serialized = JSON.stringify(normalized);
          localStorage.setItem(STORAGE_KEY, serialized);
          state = normalized;
          invalidStoredData = null;
          lastImportSnapshotKey = snapshotKey;
          ui = createUIState();
          render();
          toast("資料匯入成功；已保留匯入前快照", "success", {
            duration: 8000,
            actions: [{ label: "復原匯入", handler: () => restoreImportSnapshot(snapshotKey) }],
          });
        } catch (err) {
          try { localStorage.setItem(STORAGE_KEY, previousRaw); } catch (restoreError) { console.error("回復匯入前資料失敗", restoreError); }
          toast(`匯入失敗，原資料未變更：${err.message || "檔案格式錯誤"}`, "error");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    }
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && $("#overlay-root").children.length) closeSheet();
  });

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredInstallPrompt = e;
  });

  window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null;
    toast("小課表已安裝到手機");
  });

  window.addEventListener("focus", () => processAutoCompletions({ announce: true }));
  window.addEventListener("pageshow", () => processAutoCompletions({ announce: false }));
  window.addEventListener("xiaokebiao:resume", () => processAutoCompletions({ announce: true }));
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") processAutoCompletions({ announce: true }); });
  setInterval(() => processAutoCompletions({ announce: false }), 45000);

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    navigator.serviceWorker.addEventListener("message", event => {
      if (event.data?.type === "PWA_UPDATE_STATUS") {
        pwaUpdateState = event.data;
        if (pwaUpdateState.available) showPwaUpdateSheet();
      } else if (event.data?.type === "PWA_UPDATE_APPLIED") {
        try {
          localStorage.setItem(PWA_UPDATE_COMPLETED_KEY, JSON.stringify({ version: pwaUpdateState?.latestVersion || "新版", appliedAt: new Date().toISOString() }));
        } catch (error) {
          console.warn("無法保存更新完成狀態", error);
        }
        location.reload();
      }
    });
    navigator.serviceWorker.addEventListener("controllerchange", requestPwaUpdateStatus);
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").then(registration => {
        requestPwaUpdateStatus();
        registration.update().catch(err => console.warn("Service Worker 更新檢查失敗", err));
      }).catch(err => {
        console.warn("Service Worker 註冊失敗", err);
      });
    });
  }

  processAutoCompletions({ announce: false, render: false });
  render();
  refreshPushSubscriptionState({ rerender: false });
  notifyCompletedPwaUpdateIfNeeded();
  if (!state.settings?.hasCompletedOnboarding || Number(state.settings?.onboardingVersion || 0) < Domain.ONBOARDING_VERSION) {
    setTimeout(() => showOnboarding(state.settings?.onboardingCurrentStep || 1), 120);
  }
})();

</script>
</body>
</html>
