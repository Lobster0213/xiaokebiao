          <div class="field"><label for="trial-name">試教學生姓名 *</label><input id="trial-name" name="trialName" maxlength="100" value="${escapeHtml(lesson?.trial?.name || templateLesson?.trial?.name || "")}"></div>
          <div class="form-row"><div class="field"><label for="trial-fee">試教費用</label><input id="trial-fee" name="trialFee" type="number" min="0" step="50" value="${lesson?.trial?.fee || templateLesson?.trial?.fee || ""}"></div><div class="field"><label for="trial-source">來源</label><input id="trial-source" name="trialSource" maxlength="200" value="${escapeHtml(lesson?.trial?.source || templateLesson?.trial?.source || "")}" placeholder="例如：朋友介紹"></div></div>
          <div class="field"><label for="trial-contact">聯絡資訊</label><input id="trial-contact" name="trialContact" maxlength="300" value="${escapeHtml(lesson?.trial?.contact || templateLesson?.trial?.contact || "")}" placeholder="電話、LINE 或家長聯絡方式"></div>
          <div class="field"><label for="trial-result">試教結果</label><select id="trial-result" name="trialResult">${Object.entries(TRIAL_RESULT_LABELS).map(([value, label]) => `<option value="${value}" ${(lesson?.trial?.result || "pending") === value ? "selected" : ""}>${label}</option>`).join("")}</select></div>
        </div>
        <div class="field"><label for="lesson-subject">科目 *</label><input id="lesson-subject" name="subject" value="${escapeHtml(initialSubject)}" required /></div>
        <div class="field"><label for="lesson-date">開始日期 *</label><input id="lesson-date" name="date" type="date" value="${initialDate}" required /></div>
        <div class="form-row"><div class="field"><label for="start-time">開始時間 *</label><input id="start-time" name="startTime" type="time" value="${startTime}" required /></div><div class="field"><label for="end-time">結束時間 *</label><input id="end-time" name="endTime" type="time" value="${endTime}" required /></div></div>
        <div class="field"><label>課程形式</label><div class="segmented"><label><input type="radio" name="mode" value="inPerson" ${initialMode === "inPerson" ? "checked" : ""}><span>實體</span></label><label><input type="radio" name="mode" value="online" ${initialMode === "online" ? "checked" : ""}><span>線上</span></label></div></div>
        <div class="field"><label for="location">地點或線上連結</label><input id="location" name="location" value="${escapeHtml(initialLocation)}" placeholder="例如：學生家、Google Meet" />
          <div class="quick-chips" aria-label="常用地點">
            <button class="quick-chip" type="button" data-location-chip="學生家" data-mode="inPerson">學生家</button>
            <button class="quick-chip" type="button" data-location-chip="老師家" data-mode="inPerson">老師家</button>
            <button class="quick-chip" type="button" data-location-chip="Google Meet" data-mode="online">Google Meet</button>
            <button class="quick-chip" type="button" data-location-chip="Zoom" data-mode="online">Zoom</button>
          </div>
        </div>
        ${editing ? "" : `<div id="repeat-options"><div class="field"><label>排課方式</label><div class="segmented"><label><input type="radio" name="repeatType" value="once" checked><span>單次</span></label><label><input type="radio" name="repeatType" value="weekly"><span>每週固定</span></label></div></div>
        <div id="repeat-panel" class="repeat-panel">
          <div class="field"><label>每週上課日</label><div class="weekday-options">${[1,2,3,4,5,6,7].map(day => `<label class="weekday-option"><input type="checkbox" name="repeatWeekday" value="${day}" ${day === weekdayNumber(initialDate) ? "checked" : ""}><span>${weekdayName(day)}</span></label>`).join("")}</div></div>
          <div class="field"><label for="repeat-count">預計堂數 *</label><input id="repeat-count" name="repeatCount" type="number" min="1" max="100" step="1" value="12" /><div class="repeat-presets" style="margin-top:7px"><button type="button" class="repeat-preset" data-repeat-count="8">8 堂</button><button type="button" class="repeat-preset active" data-repeat-count="12">12 堂</button><button type="button" class="repeat-preset" data-repeat-count="24">24 堂</button></div></div>
          <div class="toggle-row"><div><strong>衝堂時往後補足</strong><div class="lesson-meta">跳過該日期，維持相同星期與時間補足原定堂數</div></div><label class="toggle"><input id="auto-supplement" name="autoSupplement" type="checkbox" checked><span class="slider"></span></label></div>
          <div id="repeat-summary" class="repeat-summary" aria-live="polite"></div>
          <div id="repeat-conflicts" class="conflict-panel" aria-live="polite"></div>
          <div id="partial-choice" class="partial-choice"><p>可回去修改日期、星期或時間；若仍要繼續，請明確選擇只建立未衝突堂數。</p><label class="inline-check"><input id="confirm-partial" name="confirmPartial" type="checkbox"><span id="partial-choice-label">我確認只建立未衝突堂數</span></label></div>
        </div></div>`}
        <div class="field"><label for="lesson-notes">備註</label><textarea id="lesson-notes" name="notes">${escapeHtml(initialNotes)}</textarea></div>
        <div class="form-error" data-error="form"></div>
        <div class="sheet-footer"><button class="btn btn-primary btn-full" type="submit">${editing ? "儲存修改" : (copying ? "複製這堂課" : "建立課程")}</button></div>
      </form>`, root => {
        const form = $("#lesson-form", root);
        const studentSelect = $("#lesson-student", root);
        const dateInput = $("#lesson-date", root);
        let weekdayTouched = false;
        let currentRepeatPlan = null;
        let isSubmitting = false;

        const updateLessonTypeFields = () => {
          const lessonType = new FormData(form).get("lessonType");
          $("#formal-lesson-fields", root).style.display = lessonType === "formal" ? "block" : "none";
          $("#trial-lesson-fields", root).style.display = lessonType === "trial" ? "grid" : "none";
          const repeatOptions = $("#repeat-options", root);
          if (repeatOptions) repeatOptions.style.display = lessonType === "trial" ? "none" : "block";
          if (lessonType === "trial") {
            const once = $('input[name="repeatType"][value="once"]', root);
            if (once) once.checked = true;
            if (!$("#lesson-subject", root).value.trim()) $("#lesson-subject", root).value = "試教";
          } else if (!state.students.length) {
            $('[data-error="form"]', form).textContent = "請先新增正式學生，或改選試教課程";
          }
          updateRepeatSummary();
        };
        $$('input[name="lessonType"]', root).forEach(input => input.addEventListener("change", updateLessonTypeFields));

        const selectRecentChip = studentId => {
          $$('[data-recent-student]', root).forEach(button => button.classList.toggle("active", button.dataset.recentStudent === studentId));
        };

        const updateLastLessonTemplate = () => {
          const container = $("#last-lesson-template", root);
          if (!container) return;
          const recent = latestLessonForStudent(studentSelect.value, lesson?.id);
          if (!recent) { container.innerHTML = ""; return; }
          const place = recent.location || (recent.mode === "online" ? "線上" : "未填地點");
          container.innerHTML = `<div class="copy-template"><div class="copy-template-text"><strong>套用上一堂設定</strong><span>${formatShortDate(recent.date)} · ${recent.startTime}–${recent.endTime} · ${escapeHtml(place)}</span></div><button type="button" class="btn btn-soft" data-copy-last="${recent.id}">套用</button></div>`;
          const button = $('[data-copy-last]', container);
          button?.addEventListener("click", () => {
            $("#lesson-subject", root).value = recent.subject;
            $("#start-time", root).value = recent.startTime;
            $("#end-time", root).value = recent.endTime;
            $("#location", root).value = recent.location || "";
            const modeInput = $(`input[name="mode"][value="${recent.mode}"]`, root);
            if (modeInput) modeInput.checked = true;
            toast("已套用上一堂的時間、形式與地點");
            updateRepeatSummary();
          });
        };

        const applyStudentDefaults = (copyRecent = true) => {
          const s = studentById(studentSelect.value);
          if (!s) return;
          $("#lesson-subject", root).value = s.subject;
          const recent = latestLessonForStudent(s.id, lesson?.id);
          if (recent && !editing && copyRecent) {
            $("#location", root).value = recent.location || "";
            const modeInput = $(`input[name="mode"][value="${recent.mode}"]`, root);
            if (modeInput) modeInput.checked = true;
          } else if (!editing && !copying) {
            $("#location", root).value = teacherDefaults.defaultLocation || "";
            const teacherMode = teacherDefaults.defaultLessonMode || "inPerson";
            const modeInput = $(`input[name="mode"][value="${teacherMode}"]`, root);
            if (modeInput) modeInput.checked = true;
          }
          if (!editing && !copying) {
            const start = $("#start-time", root).value;
            $("#end-time", root).value = addMinutes(start, s.defaultDuration || teacherDefaults.defaultDuration || 60);
          }
          selectRecentChip(s.id);
          updateLastLessonTemplate();
          updateRepeatSummary();
        };

        const repeatPanel = $("#repeat-panel", root);
        const updateRepeatSummary = () => {
          if (!repeatPanel) return;
          const type = new FormData(form).get("repeatType");
          repeatPanel.classList.toggle("open", type === "weekly");
          if (type !== "weekly") {
            currentRepeatPlan = null;
            return;
          }
          const weekdays = $$('input[name="repeatWeekday"]:checked', root).map(input => Number(input.value));
          const targetCount = Number($("#repeat-count", root).value);
          const autoSupplement = $("#auto-supplement", root).checked;
          const baseLesson = {
            studentId: studentSelect.value,
            subject: $("#lesson-subject", root).value.trim(),
            date: dateInput.value,
            startTime: $("#start-time", root).value,
            endTime: $("#end-time", root).value,
          };
          currentRepeatPlan = generateRecurringLessonPlan({
            startDate: dateInput.value,
            weekdays,
            targetCount,
            baseLesson,
          }, state.lessons, { autoSupplement, maxWeeks: 104 });
          const daysText = weekdays.map(day => `週${weekdayName(day)}`).join("、") || "尚未選擇";
          const summary = $("#repeat-summary", root);
          const conflictCount = currentRepeatPlan.skipped.length;
          const acceptedCount = currentRepeatPlan.accepted.length;
          const normalDates = currentRepeatPlan.accepted.filter(candidate => !currentRepeatPlan.supplemented.includes(candidate)).map(candidate => formatShortDate(candidate.date));
          const skippedDates = currentRepeatPlan.skipped.map(item => formatShortDate(item.candidate.date));
          const supplementedDates = currentRepeatPlan.supplemented.map(candidate => formatShortDate(candidate.date));
          const lastText = currentRepeatPlan.lastDate ? formatDate(currentRepeatPlan.lastDate) : "尚未產生";
          const planText = autoSupplement
            ? `將跳過衝突日期並往後補排；最後${currentRepeatPlan.limitReached ? `只能建立 ${acceptedCount} 堂` : `仍會建立 ${acceptedCount} 堂`}。`
            : `自動補排已關閉；目前只可建立 ${acceptedCount} 堂。`;
          summary.innerHTML = `<strong>${daysText} ${escapeHtml(baseLesson.startTime || "--:--")}</strong><br>原定 <strong>${Number.isInteger(targetCount) && targetCount > 0 ? targetCount : 0}</strong> 堂 · <strong>${conflictCount}</strong> 堂發生衝突<br>${planText}<br>最後一堂：${escapeHtml(lastText)}
            <details class="repeat-plan-details"><summary>查看排課日期</summary><div class="repeat-plan-dates">正常建立：${normalDates.length ? escapeHtml(normalDates.join("、")) : "無"}<br>跳過衝突：${skippedDates.length ? escapeHtml(skippedDates.join("、")) : "無"}<br>往後補上：${supplementedDates.length ? escapeHtml(supplementedDates.join("、")) : "無"}</div></details>`;

          const conflictPanel = $("#repeat-conflicts", root);
          conflictPanel.classList.toggle("visible", conflictCount > 0);
          conflictPanel.innerHTML = conflictCount ? `<strong>有 ${conflictCount} 個時段與既有課程衝突</strong><ul class="conflict-list">${currentRepeatPlan.skipped.map(item => {
            const message = formatConflictMessage(item);
            return `<li class="conflict-item"><span>${escapeHtml(message.dateText)} ${escapeHtml(message.candidateTime)}</span><span>${escapeHtml(message.detail)}</span></li>`;
          }).join("")}</ul>` : "";

          const partialChoice = $("#partial-choice", root);
          const showPartial = !autoSupplement && conflictCount > 0;
          partialChoice.classList.toggle("visible", showPartial);
          $("#partial-choice-label", root).textContent = `我確認：預計 ${targetCount || 0} 堂，將只建立 ${acceptedCount} 堂`;
          if (!showPartial) $("#confirm-partial", root).checked = false;
        };

        studentSelect.addEventListener("change", () => applyStudentDefaults(true));
        $$('[data-recent-student]', root).forEach(button => button.addEventListener("click", () => {
          studentSelect.value = button.dataset.recentStudent;
          applyStudentDefaults(true);
        }));
        $$('[data-location-chip]', root).forEach(button => button.addEventListener("click", () => {
          $("#location", root).value = button.dataset.locationChip || "";
          const modeInput = $(`input[name="mode"][value="${button.dataset.mode}"]`, root);
          if (modeInput) modeInput.checked = true;
        }));
        $("#start-time", root).addEventListener("change", () => {
          if (!editing && !copying) {
            const s = studentById(studentSelect.value);
            $("#end-time", root).value = addMinutes($("#start-time", root).value, s?.defaultDuration || teacherDefaults.defaultDuration || 60);
          }
          updateRepeatSummary();
        });
        $("#end-time", root).addEventListener("change", updateRepeatSummary);

        if (!editing) {
          $$('input[name="repeatType"]', root).forEach(el => el.addEventListener("change", updateRepeatSummary));
          $$('input[name="repeatWeekday"]', root).forEach(el => el.addEventListener("change", () => { weekdayTouched = true; updateRepeatSummary(); }));
          dateInput.addEventListener("change", () => {
            if (!weekdayTouched) {
              $$('input[name="repeatWeekday"]', root).forEach(input => { input.checked = Number(input.value) === weekdayNumber(dateInput.value); });
            }
            updateRepeatSummary();
          });
          $("#repeat-count", root).addEventListener("input", () => {
            $$('[data-repeat-count]', root).forEach(button => button.classList.toggle("active", Number(button.dataset.repeatCount) === Number($("#repeat-count", root).value)));
            updateRepeatSummary();
          });
          $("#auto-supplement", root).addEventListener("change", updateRepeatSummary);
          $("#lesson-subject", root).addEventListener("input", updateRepeatSummary);
          $$('[data-repeat-count]', root).forEach(button => button.addEventListener("click", () => {
            $$('[data-repeat-count]', root).forEach(item => item.classList.toggle("active", item === button));
            $("#repeat-count", root).value = button.dataset.repeatCount;
            updateRepeatSummary();
          }));
        }

        updateLastLessonTemplate();
        updateRepeatSummary();
        updateLessonTypeFields();

        form.addEventListener("submit", e => {
          e.preventDefault();
          const fd = new FormData(form);
          const lessonType = String(fd.get("lessonType") || "formal");
          const candidate = {
            studentId: lessonType === "trial" ? "" : String(fd.get("studentId") || ""), subject: String(fd.get("subject") || "").trim(), date: String(fd.get("date")), startTime: String(fd.get("startTime")), endTime: String(fd.get("endTime")),
          };
          const error = $('[data-error="form"]', form); error.textContent = "";
          const trialName = String(fd.get("trialName") || "").trim();
          if ((lessonType === "formal" && !candidate.studentId) || (lessonType === "trial" && !trialName) || !candidate.subject || !candidate.date || !candidate.startTime || !candidate.endTime) { error.textContent = "請完成所有必填欄位"; return; }
          if (timeToMinutes(candidate.endTime) <= timeToMinutes(candidate.startTime)) { error.textContent = "結束時間必須晚於開始時間"; return; }
          const now = new Date().toISOString();
          const base = {
            id: lesson?.id || uid("lesson"), ...candidate, lessonType, trial: {
              name: trialName,
              fee: Number(fd.get("trialFee") || 0),
              source: String(fd.get("trialSource") || "").trim(),
              contact: String(fd.get("trialContact") || "").trim(),
              result: String(fd.get("trialResult") || "pending"),
              convertedStudentId: lesson?.trial?.convertedStudentId || null,
            }, mode: fd.get("mode"), location: String(fd.get("location") || "").trim(), recurrenceGroupId: lesson?.recurrenceGroupId || null, status: lesson?.status || "scheduled", startedAt: lesson?.startedAt || null, recordId: lesson?.recordId || null, notes: String(fd.get("notes") || "").trim(), isDemoData: Boolean(lesson?.isDemoData), createdAt: lesson?.createdAt || now, updatedAt: now,
          };
          if (editing) {
            if (hasScheduleConflict(base, lesson.id)) { error.textContent = "此時段與其他課程重疊，請調整時間"; return; }
            state.lessons = state.lessons.map(l => l.id === lesson.id ? base : l);
            saveData(); closeSheet(); ui.tab = "schedule"; ui.studentDetailId = null; ui.selectedDate = base.date; render(); toast("課程已更新");
            return;
          }

          const repeatType = lessonType === "trial" ? "once" : fd.get("repeatType");
          if (repeatType === "weekly") {
            const weekdays = fd.getAll("repeatWeekday").map(Number);
            const targetCount = Number(fd.get("repeatCount"));
            const autoSupplement = fd.get("autoSupplement") === "on";
            if (!weekdays.length) { error.textContent = "請至少選擇一個每週上課日"; return; }
            if (!Number.isInteger(targetCount) || targetCount < 1 || targetCount > 100) { error.textContent = "預計堂數請輸入 1～100 的整數"; return; }
            currentRepeatPlan = generateRecurringLessonPlan({
              startDate: base.date,
              weekdays,
              targetCount,
              baseLesson: base,
            }, state.lessons, { autoSupplement, maxWeeks: 104 });
            updateRepeatSummary();
            if (currentRepeatPlan.limitReached) {
              error.textContent = `已搜尋 104 週，仍只能安排 ${currentRepeatPlan.accepted.length} 堂，請修改排課條件`;
              return;
            }
            if (!currentRepeatPlan.accepted.length) { error.textContent = "所有固定日期都與既有課程衝突，沒有可建立的課程"; return; }
            if (!autoSupplement && currentRepeatPlan.skipped.length) {
              if (fd.get("confirmPartial") !== "on") {
                error.textContent = `請確認「預計 ${targetCount} 堂，將只建立 ${currentRepeatPlan.accepted.length} 堂」後再儲存`;
                return;
              }
              if (!confirm(`預計 ${targetCount} 堂，將只建立 ${currentRepeatPlan.accepted.length} 堂。確定繼續嗎？`)) return;
            }
            if (isSubmitting) return;
            isSubmitting = true;
            const submitButton = $('button[type="submit"]', form);
            submitButton.disabled = true;
            const created = materializeRecurringLessons(base, currentRepeatPlan.accepted);
            const previousLessons = state.lessons;
            try {
              state.lessons = [...previousLessons, ...created];
              saveData();
              closeSheet();
              ui.tab = "schedule";
              ui.studentDetailId = null;
              ui.selectedDate = created[0].date;
              render();
              const groupId = created[0].recurrenceGroupId;
              toast(
                currentRepeatPlan.skipped.length ? `已跳過 ${currentRepeatPlan.skipped.length} 個衝突時段並建立 ${created.length} 堂` : `已建立 ${created.length} 堂固定課程`,
                "success",
                {
                  duration: 8000,
                  actions: [
                    { label: "查看課表", handler: () => { ui.tab = "schedule"; ui.selectedDate = created[0].date; render(); } },
                    { label: "復原本次排課", handler: () => undoRecurrenceGroup(groupId) },
                  ],
                },
              );
            } catch (err) {
              state.lessons = previousLessons;
              isSubmitting = false;
              submitButton.disabled = false;
              error.textContent = err.message || "固定課程建立失敗，未寫入任何課程";
            }
            return;
          }

          const single = { ...base, id: uid("lesson"), recurrenceGroupId: null, status: "scheduled", startedAt: null, recordId: null };
          if (hasScheduleConflict(single)) { error.textContent = "此時段與其他課程重疊，請調整時間"; return; }
          state.lessons.push(single);
          saveData(); closeSheet(); ui.tab = "schedule"; ui.studentDetailId = null; ui.selectedDate = single.date; render(); toast(copying ? "課程已複製到新的日期" : "課程已新增");
        });
      });
  }

  function completeLesson(lesson, status, deductLesson, note) {
    Domain.completeLessonTransaction(state, {
      lessonId: lesson.id,
      status,
      deductLesson,
      note,
      idFactory: uid,
      now: new Date().toISOString(),
    });
    saveData();
  }

  function recordSheet(lesson) {
    const existing = recordByLessonId(lesson.id);
    const initialStatus = existing?.status || (lesson.status === "inProgress" ? "completed" : (STATUS_LABELS[lesson.status] ? lesson.status : "completed"));
    openSheet(existing ? "修改上課紀錄" : "完成課程", `
      <form id="record-form" class="form-grid">
        <div class="field"><label>課程結果</label><div class="status-options">${["completed","studentLeave","teacherLeave","absent","cancelled","rescheduled"].map(status => `<label class="status-option"><input type="radio" name="status" value="${status}" ${initialStatus === status ? "checked" : ""}><span>${STATUS_LABELS[status]}</span></label>`).join("")}</div></div>
        <div class="toggle-row"><div><strong>扣除一堂</strong><div class="lesson-meta">${lesson.lessonType === "trial" ? "試教預設不扣正式堂數" : "可依你的請假規則調整"}</div></div><label class="toggle"><input id="deduct-toggle" name="deductLesson" type="checkbox" ${lesson.lessonType === "trial" ? "disabled" : (existing ? (existing.deductLesson ? "checked" : "") : (DEFAULT_DEDUCT[initialStatus] ? "checked" : ""))}><span class="slider"></span></label></div>
        <div class="field"><label for="record-note">課堂備註</label><textarea id="record-note" name="note" placeholder="今天完成了什麼、下次要注意什麼…">${escapeHtml(existing?.note || lesson.notes || "")}</textarea></div>
        <div class="form-error" data-error="form"></div>
        <div class="sheet-footer"><button class="btn btn-primary btn-full" type="submit">儲存紀錄</button></div>
      </form>`, root => {
        const form = $("#record-form", root);
        const toggle = $("#deduct-toggle", root);
        $$('input[name="status"]', root).forEach(radio => radio.addEventListener("change", () => { toggle.checked = lesson.lessonType === "trial" ? false : DEFAULT_DEDUCT[radio.value]; }));
        form.addEventListener("submit", e => {
          e.preventDefault();
          const fd = new FormData(form);
          try {
            completeLesson(lesson, String(fd.get("status")), fd.get("deductLesson") === "on", String(fd.get("note") || "").trim());
            closeSheet(); render(); toast(existing ? "紀錄已更新，堂數已重新計算" : "課程紀錄已完成");
          } catch (err) {
            $('[data-error="form"]', form).textContent = err.message || "儲存失敗";
          }
        });
      });
  }

  function quickCompleteLesson(id) {
    const lesson = lessonById(id);
    if (!lesson) return;
    const student = studentById(lesson.studentId);
    try {
      completeLesson(lesson, "completed", true, recordByLessonId(lesson.id)?.note || lesson.notes || "");
      render();
      toast(student?.billingType === "package" ? "已記錄完成並扣除 1 堂" : "已記錄完成");
    } catch (err) {
      toast(err.message || "無法完成課程", "error");
      recordSheet(lesson);
    }
  }

  function startLesson(id) {
    const lesson = lessonById(id);
    if (!lesson || lesson.status !== "scheduled") return;
    lesson.status = "inProgress";
    lesson.startedAt = new Date().toISOString();
    lesson.updatedAt = lesson.startedAt;
    saveData(); render(); toast("已開始上課");
  }

  function exportTimestamp(date = new Date()) {
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}`;
  }

  function downloadBlobFile(parts, type, filename) {
    const blob = new Blob(parts, { type });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    try {
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
    } finally {
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    }
  }

  function downloadJsonFile(data, filename) {
    downloadBlobFile([JSON.stringify(data, null, 2)], "application/json;charset=utf-8", filename);
  }

  function escapeCsvCell(value) {
    return Domain.sanitizeCsvCell(value);
  }

  function downloadCsvFile(rows, filename) {
    const csv = rows.map(row => row.map(escapeCsvCell).join(",")).join("\r\n");
    downloadBlobFile(["\ufeff", csv], "text/csv;charset=utf-8", filename);
  }

  function exportJsonBackup() {
    try {
      const payload = {
        dataVersion: DATA_VERSION,
        version: APP_VERSION,
        exportedAt: new Date().toISOString(),
        teacherProfile: normalizeTeacherProfile(state.teacherProfile),
        students: state.students,
        lessons: state.lessons,
        lessonRecords: state.lessonRecords,
        lessonCreditTransactions: state.lessonCreditTransactions,
        settings: state.settings,
      };
      downloadJsonFile(payload, `小課表完整備份_${exportTimestamp()}.json`);
      toast("完整 JSON 備份已下載");
    } catch (err) {
      console.error("JSON 匯出失敗", err);
      toast(`JSON 匯出失敗：${err.message || "無法建立檔案"}`, "error");
    }
  }

  function exportLessonCsv() {
    try {
      const headers = ["日期", "星期", "開始時間", "結束時間", "學生姓名", "科目", "授課方式", "地點／連結", "課程狀態", "是否扣堂", "課堂備註", "每堂費用"];
      const sortedLessons = [...state.lessons].sort((a, b) => {
        const dateOrder = a.date.localeCompare(b.date);
        return dateOrder || a.startTime.localeCompare(b.startTime);
      });
      const rows = sortedLessons.map(lesson => {
        const student = lesson.lessonType === "trial"
          ? { name: `${lesson.trial?.name || "未命名"}（試教）`, pricePerLesson: lesson.trial?.fee || "" }
          : (studentById(lesson.studentId) || { name: "已刪除學生", pricePerLesson: "" });
        const record = recordByLessonId(lesson.id);
        return [
          lesson.date,
          `星期${weekdayName(weekdayNumber(lesson.date))}`,
          lesson.startTime,
          lesson.endTime,
          student.name,
          lesson.subject,
          lesson.mode === "online" ? "線上" : "實體",
          lesson.location || "",
          STATUS_LABELS[lesson.status] || lesson.status,
          record?.deductLesson ? "是" : "否",
          record?.note || lesson.notes || "",
          student.pricePerLesson ?? "",
        ];
      });
      downloadCsvFile([headers, ...rows], `小課表課程明細_${todayISO()}.csv`);
      toast("課程 CSV 已下載");
    } catch (err) {
      console.error("CSV 匯出失敗", err);
      toast(`CSV 匯出失敗：${err.message || "無法建立檔案"}`, "error");
    }
  }

  function clearAllData() {
    if (!confirm("確定要清除全部資料嗎？此操作無法復原。")) return;
    if (!confirm("最後確認：學生、課程與紀錄都會被刪除。")) return;
    state = { teacherProfile: defaultTeacherProfile(), students: [], lessons: [], lessonRecords: [], version: APP_VERSION };
    saveData(); ui = createUIState(); render(); toast("資料已清除");
  }

  function resetDemo() {
    if (!confirm("重新載入示範資料會覆蓋目前內容，確定繼續嗎？")) return;
    state = createDemoData(); saveData(); ui = createUIState(); render(); toast("示範資料已重新載入");
  }

  document.addEventListener("click", e => {
    const tab = e.target.closest("[data-tab]");
    if (tab) {
      ui.tab = tab.dataset.tab; ui.studentDetailId = null; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return;
    }
    const calendarView = e.target.closest("[data-calendar-view]");
    if (calendarView) {
      ui.calendarView = calendarView.dataset.calendarView === "month" ? "month" : "week";
      saveCalendarView(ui.calendarView);
      render();
      return;
    }
    const date = e.target.closest("[data-date]");
    if (date) { ui.selectedDate = date.dataset.date; render(); return; }
    const actionEl = e.target.closest("[data-action]");
    if (!actionEl) return;
    const action = actionEl.dataset.action;
    const id = actionEl.dataset.id;
    if (action === "notify") toast("通知功能會在後續版本加入");
    else if (action === "add-student") studentForm();
    else if (action === "edit-student") studentForm(studentById(id));
    else if (action === "add-credit") creditSheet(studentById(id));
    else if (action === "edit-teacher") teacherProfileForm();
    else if (action === "install-app") installApp();
    else if (action === "add-lesson") lessonForm(null, actionEl.dataset.studentId || null);
    else if (action === "add-calendar-lesson") {
      const date = actionEl.dataset.calendarDate || ui.selectedDate;
      ui.selectedDate = date;
      lessonForm(null, null, null, { date, startTime: actionEl.dataset.startTime || null });
    }
    else if (action === "course-detail") courseDetailSheet(lessonById(id));
    else if (action === "delete-lesson") deleteLessonSheet(lessonById(id));
    else if (action === "convert-trial") convertTrialSheet(lessonById(id));
    else if (action === "edit-lesson") lessonForm(lessonById(id));
    else if (action === "copy-lesson") { const source = lessonById(id); if (source) lessonForm(null, source.studentId, source); }
    else if (action === "start-lesson") { closeSheet(); startLesson(id); }
    else if (action === "quick-complete") { closeSheet(); quickCompleteLesson(id); }
    else if (action === "lesson-more" || action === "complete-lesson" || action === "edit-record") { const lesson = lessonById(id); if (lesson) recordSheet(lesson); }
    else if (action === "open-student") { ui.studentDetailId = id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else if (action === "back-students") { ui.studentDetailId = null; ui.tab = "students"; render(); }
    else if (action === "date-prev") { ui.selectedDate = addDays(ui.selectedDate, -1); render(); }
    else if (action === "date-next") { ui.selectedDate = addDays(ui.selectedDate, 1); render(); }
    else if (action === "calendar-prev") { ui.selectedDate = ui.calendarView === "month" ? addMonths(ui.selectedDate, -1) : addDays(ui.selectedDate, -7); render(); }
    else if (action === "calendar-next") { ui.selectedDate = ui.calendarView === "month" ? addMonths(ui.selectedDate, 1) : addDays(ui.selectedDate, 7); render(); }
    else if (action === "calendar-today") { ui.selectedDate = todayISO(); render(); }
    else if (action === "close-sheet") closeSheet();
    else if (action === "export-json" || action === "export-data") exportJsonBackup();
    else if (action === "export-csv") exportLessonCsv();
    else if (action === "import-data") $("#import-file")?.click();
    else if (action === "clear-data") clearAllData();
    else if (action === "reset-demo") resetDemo();
  });

  document.addEventListener("input", e => {
    if (e.target.id === "student-search") {
      ui.search = e.target.value;
      const cursor = e.target.selectionStart;
      render();
      const input = $("#student-search");
      if (input) { input.focus(); input.setSelectionRange(cursor, cursor); }
    }
  });

  document.addEventListener("change", e => {
    if (e.target.id === "import-file") {
      const file = e.target.files?.[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        toast("匯入失敗：檔案不可超過 5 MB", "error");
        e.target.value = "";
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const normalized = normalizeStoredData(parsed, { existingUser: true });
          if (!validateImportedData(normalized)) throw new Error("資料格式不正確");
          state = normalized;
          saveData(); ui = createUIState(); render(); toast("資料匯入成功");
        } catch (err) {
          toast(`匯入失敗：${err.message || "檔案格式錯誤"}`, "error");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    }
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && $("#overlay-root").children.length) closeSheet();
  });

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredInstallPrompt = e;
  });

  window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null;
    toast("小課表已安裝到手機");
  });

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(err => {
        console.warn("Service Worker 註冊失敗", err);
      });
    });
  }

  render();
})();

</script>
</body>
</html>
